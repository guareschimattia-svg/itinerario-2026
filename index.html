<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Vacanza 2026 — Diario condiviso</title>
<style>
  :root {
    --ink: #24292e;
    --ink-soft: #57606a;
    --line: #d0d7de;
    --bg: #ffffff;
    --accent: #0969da;
    --paid: #2e7d46;
    --paid-bg: #eaf5ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f6f8fa;
    color: var(--ink);
    padding-bottom: 84px;
  }
  h1, h2, h3 { margin: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 15;
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 0.85rem 1rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 1.1rem; font-weight: 700; }
  .who-btn {
    background: #f6f8fa;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 0.4rem 0.7rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .who-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 1rem; }
  .view { display: none; }
  .view.active { display: block; }

  /* Diary */
  .calendar-wrap {
    position: sticky;
    top: 57px;
    background: #f6f8fa;
    padding: 0.7rem 0 0.6rem;
    margin-bottom: 0.8rem;
    z-index: 9;
    border-bottom: 1px solid var(--line);
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-wd { font-size: 0.72rem; color: var(--ink-soft); text-align: center; font-weight: 700; padding-bottom: 4px; }
  .cal-cell {
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; color: #c8ccd1;
    border-radius: 50%;
    text-decoration: none;
  }
  .cal-active {
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    font-weight: 700;
    cursor: pointer;
  }
  .cal-active.current {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 2px 6px rgba(9,105,218,0.35);
    transform: scale(1.08);
  }
  .day-card {
    background: var(--bg);
    border-radius: 10px;
    margin-bottom: 1rem;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .day-head-static {
    padding: 0.6rem 0.5rem;
    background: #f6f8fa;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 0.4rem;
  }
  .day-head-mid { flex: 1; text-align: center; min-width: 0; cursor: pointer; }
  .day-head-mid .dtitle { font-weight: 700; font-size: 0.92rem; }
  .day-head-mid .dnum { font-size: 0.68rem; color: var(--accent); font-weight: 600; margin-bottom: 0.1rem; }
  .day-nav-btn {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .day-nav-btn:disabled { color: var(--line); cursor: default; }
  .day-nav-btn:active:not(:disabled) { background: #eef4fc; }
  .day-body { padding: 0.8rem 1rem 1rem; }
  .maps-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.8rem; }
  .maps-chip {
    font-size: 0.74rem;
    color: var(--accent);
    background: #eef4fc;
    border: 1px solid #cfe0f5;
    border-radius: 20px;
    padding: 0.28rem 0.6rem;
    text-decoration: none;
  }
  .maps-chip:before { content: "📍"; font-size: 0.7rem; margin-right: 0.2rem; }
  .dayrow { display: flex; gap: 0.6rem; margin-bottom: 0.6rem; align-items: flex-start; }
  .dayrow .rlabel {
    flex: 0 0 24px;
    height: 26px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin-top: 4px;
  }
  .dayrow .swipe-wrap { flex: 1; min-width: 0; margin-bottom: 0; }
  .dayrow textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
    font-family: inherit;
    font-size: 0.88rem;
    line-height: 1.45;
    color: var(--ink);
    background: #fff;
    resize: vertical;
    min-height: 46px;
  }
  .dayrow textarea:focus { outline: none; border-color: var(--accent); }
  .rdisplay {
    flex: 1;
    padding: 0.5rem 0.6rem;
    line-height: 1.45;
    color: var(--ink);
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: text;
  }
  .rdisplay:hover { background: #f6f8fa; border-color: var(--line); }
  .rdisplay .rempty { color: var(--ink-soft); font-style: italic; font-size: 0.88rem; }
  .rline-main { font-size: 0.88rem; color: var(--ink); }
  .rline-note {
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-top: 0.3rem;
    padding-top: 0.3rem;
    border-top: 1px dotted var(--line);
  }
  .rdisplay .place-link {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(9,105,218,0.4);
    text-underline-offset: 2px;
  }
  .diary-meta { font-size: 0.7rem; color: var(--ink-soft); margin-top: 0.5rem; min-height: 1em; }

  /* Expenses */
  .exp-hero {
    background: var(--bg);
    border-radius: 10px;
    border: 1px solid var(--line);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .exp-hero-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0.35rem 0; }
  .exp-hero-row .lbl { font-size: 0.85rem; color: var(--ink-soft); }
  .exp-hero-row .val { font-weight: 700; font-size: 1.1rem; }
  .exp-hero-row.grand { border-top: 2px solid var(--ink); margin-top: 0.4rem; padding-top: 0.6rem; }
  .exp-hero-row.grand .val { font-size: 1.4rem; color: var(--accent); }
  .exp-cat { margin-bottom: 1rem; }
  .exp-cat h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .cat-header-content {
    padding: 0.55rem 0.7rem;
    background: #eef4fc;
    border: 1px solid #cfe0f5;
    border-left: 4px solid var(--accent);
    border-radius: 8px;
  }
  .cat-header-content h3 {
    margin: 0 !important;
    font-size: 1rem !important;
    font-weight: 800 !important;
    color: var(--accent) !important;
    letter-spacing: 0.01em;
  }
  .cat-edit-input {
    width: 100%;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 0.3rem 0.5rem;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--ink);
  }
  .inline-edit-input {
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 0.35rem 0.5rem;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    flex: 1;
    min-width: 0;
  }
  .cat-add-area { display: flex; justify-content: flex-end; margin-bottom: 0.6rem; }
  .cat-add-icon-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    background: #eef4fc;
    color: var(--accent);
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-add-row { width: 100%; }
  .swipe-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 0.45rem;
  }
  .swipe-actions-bg {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: flex-end;
  }
  .swipe-act {
    width: 74px;
    height: 100%;
    border: none;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .swipe-act.act-edit { background: var(--accent); }
  .swipe-act.act-delete { background: #d1453b; }
  .swipe-content {
    position: relative;
    touch-action: pan-y;
    transition: transform 0.2s ease;
    background: var(--bg);
  }
  .item-cell {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--bg);
  }
  .exp-item.is-actual { border-left: 3px solid var(--paid); background: var(--paid-bg); }
  .exp-item .exp-label { font-size: 0.85rem; flex: 1; min-width: 0; word-break: break-word; }
  .exp-item input[type="number"] {
    width: 90px;
    flex-shrink: 0;
    padding: 0.4rem 0.4rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 0.85rem;
    font-family: inherit;
    color: var(--ink);
  }
  .exp-item input[type="number"]::placeholder { color: #b7bec4; font-size: 0.72rem; }
  .del-btn {
    background: none; border: none; color: #bb4d38; font-size: 1.05rem; cursor: pointer; padding: 0 0.2rem; flex-shrink: 0;
  }
  .add-link {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.4rem 0.1rem;
    margin-top: 0.2rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .add-row { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
  .add-row input { flex: 1; min-width: 0; padding: 0.5rem 0.5rem; border: 1px solid var(--line); border-radius: 6px; font-size: 0.84rem; font-family: inherit; }
  .add-row input.short { flex: 0 0 60px; width: 60px; min-width: 0; }
  .add-row button {
    flex-shrink: 0;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 0.5rem 0.65rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }

  /* Packing */
  .pack-cat { margin-bottom: 1.1rem; }
  .pack-cat h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .pack-item { justify-content: space-between; }
  .p-label {
    font-size: 0.85rem; color: var(--ink); flex: 1; min-width: 0; word-break: break-word;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .p-label.is-done { color: var(--ink-soft); text-decoration: line-through; }
  .p-label.done-a { text-decoration-color: #0969da; }
  .p-label.done-b { text-decoration-color: #c07a1e; }
  .p-label.done-both { text-decoration-style: double; text-decoration-color: var(--ink-soft); }
  .p-who { display: flex; gap: 5px; flex-shrink: 0; }
  .p-who-dot {
    width: 8px;
    height: 26px;
    border-radius: 4px;
    background: #e4e8eb;
    display: block;
  }
  .p-who-dot.who-a.on { background: #0969da; }
  .p-who-dot.who-b.on { background: #c07a1e; }

  /* Food */
  .food-cat { margin-bottom: 1rem; }
  .food-cat h3 { font-size: 0.95rem; margin-bottom: 0.4rem; }
  .food-label { font-size: 0.85rem; color: var(--ink); flex: 1; min-width: 0; word-break: break-word; }

  /* Bottom nav */
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #fff;
    border-top: 1px solid var(--line);
    display: flex;
    padding: 0.4rem 0.6rem calc(0.4rem + env(safe-area-inset-bottom));
  }
  .nav-btn {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
    background: none; border: none; padding: 0.4rem 0.2rem;
    color: var(--ink-soft); font-family: inherit; font-size: 0.65rem; font-weight: 600;
    cursor: pointer; border-radius: 8px;
  }
  .nav-btn .ic { font-size: 1.15rem; }
  .nav-btn.active { color: var(--accent); background: #eef4fc; }

  /* Who modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 1.2rem;
  }
  .modal-backdrop.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 1.3rem; max-width: 300px; width: 100%; }
  .modal h2 { font-size: 1.05rem; margin-bottom: 0.9rem; }
  .modal button.who-pick {
    display: block; width: 100%; padding: 0.7rem; margin-bottom: 0.5rem;
    border: 2px solid var(--line); background: #fff; border-radius: 8px;
    font-family: inherit; font-size: 0.92rem; font-weight: 600; color: var(--ink);
    cursor: pointer;
  }
  .sync-status { font-size: 0.68rem; text-align: center; color: var(--ink-soft); padding: 0.4rem 0 0; }
  .sync-status.err { color: #bb4d38; }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <h1>🌊 Vacanza 2026</h1>
  <button class="who-btn" id="whoBtn"><span class="who-dot" id="whoDot"></span><span id="whoLabel">Chi sei?</span></button>
</div>

<main>
  <section id="view-diario" class="view active">
    <div id="calendarGrid" class="calendar-wrap"></div>
    <div id="daysContainer"></div>
  </section>

  <section id="view-spese" class="view">
    <div class="exp-hero">
      <div class="exp-hero-row"><span class="lbl">Stima totale</span><span class="val" id="expEstTotal">—</span></div>
      <div class="exp-hero-row"><span class="lbl">Speso finora (importi confermati)</span><span class="val" id="expActualTotal">—</span></div>
      <div class="exp-hero-row grand"><span class="lbl">Rimane da spendere</span><span class="val" id="expRemaining">—</span></div>
    </div>
    <div id="expCatAddArea" class="cat-add-area"></div>
    <div id="expCategories"></div>
  </section>

  <section id="view-portare" class="view">
    <div id="packCatAddArea" class="cat-add-area"></div>
    <div id="packCategories"></div>
  </section>

  <section id="view-assaggiare" class="view">
    <div id="foodCatAddArea" class="cat-add-area"></div>
    <div id="foodCategories"></div>
  </section>
</main>

<nav class="bottom-bar">
  <button class="nav-btn active" data-view="diario"><span class="ic">📅</span>Itinerario</button>
  <button class="nav-btn" data-view="spese"><span class="ic">💶</span>Spese</button>
  <button class="nav-btn" data-view="portare"><span class="ic">🎒</span>Da portare</button>
  <button class="nav-btn" data-view="assaggiare"><span class="ic">🍋</span>Da assaggiare</button>
</nav>

<div class="modal-backdrop" id="whoModal">
  <div class="modal">
    <h2>Chi sei?</h2>
    <button class="who-pick" data-person="A">Mattia</button>
    <button class="who-pick" data-person="B">Adriana</button>
    <div class="sync-status" id="syncStatus">Connessione al database…</div>
  </div>
</div>

const SEED = {"days": [{"id": "d1", "title": "Parma → Sabaudia (Sab 29 agosto)", "links": [{"label": "Parma", "url": "https://maps.apple.com/?ll=44.8015,10.3279&q=Parma"}, {"label": "Sabaudia", "url": "https://maps.apple.com/?ll=41.3009,13.0269&q=Sabaudia"}, {"label": "Lago di Bolsena", "url": "https://maps.apple.com/?ll=42.6100,11.9750&q=Lago%20di%20Bolsena"}], "M": "partenza da Parma.", "P": "viaggio verso Sabaudia (~5h30/6h totali), con sosta al Lago di Bolsena (uscita A1 Orvieto, circa a metà strada) per un bagno rinfrescante e uno spuntino veloce sul lungolago.\n🥪 Pranzo semplice (panino) sul lungolago di Bolsena.", "S": "arrivo e sistemazione.\n🍕 Pizza direttamente al campeggio, per la prima sera senza pensieri."}, {"id": "d2", "title": "Sabaudia (Dom 30 agosto)", "links": [{"label": "Sabaudia", "url": "https://maps.apple.com/?ll=41.3009,13.0269&q=Sabaudia"}, {"label": "Lago di Paola", "url": "https://maps.apple.com/?ll=41.2967,13.0500&q=Lago%20di%20Paola"}, {"label": "Sperlonga", "url": "https://maps.apple.com/?ll=41.2540,13.4330&q=Sperlonga"}, {"label": "Terracina", "url": "https://maps.apple.com/?ll=41.2926,13.2496&q=Terracina"}], "M": "mare con calma, spiaggia del Lido di Sabaudia.\n🥪 Pranzo semplice (panino) in spiaggia.", "P": "canoa sul Lago di Paola (unico lago del Circeo dove è permessa la canoa libera), poi una breve passeggiata nella foresta del Parco Nazionale del Circeo (foresta pluviale mediterranea, rara in Italia).", "S": "spesa a Sabaudia prima che chiudano i negozi, poi relax al campeggio (o, in alternativa, una delle novità nei dintorni come Sperlonga o Terracina).\n🔥 Grigliata di carne al campeggio."}, {"id": "d3", "title": "Sabaudia (Lun 31 agosto)", "links": [{"label": "Sabaudia", "url": "https://maps.apple.com/?ll=41.3009,13.0269&q=Sabaudia"}, {"label": "Monte Circeo", "url": "https://maps.apple.com/?ll=41.2380,13.0550&q=Monte%20Circeo"}, {"label": "San Felice Circeo", "url": "https://maps.apple.com/?ll=41.2439,13.0872&q=San%20Felice%20Circeo"}], "M": "spiaggia, mare con calma.", "P": "trekking sul Monte Circeo fino alla cima — sentiero impegnativo ma con vista straordinaria su tutto il promontorio, le isole Ponziane e la costa.\n🥪 Panino/pranzo al sacco durante il trekking.", "S": "spesa a San Felice Circeo prima che chiudano i negozi, rientro al campeggio.\n🐟 Grigliata di pesce al campeggio."}, {"id": "d4", "title": "Sabaudia (Mar 1 settembre)", "links": [{"label": "Sabaudia", "url": "https://maps.apple.com/?ll=41.3009,13.0269&q=Sabaudia"}, {"label": "Terracina", "url": "https://maps.apple.com/?ll=41.2926,13.2496&q=Terracina"}], "M": "giornata a Terracina (~40 min da Sabaudia) — Tempio di Giove Anxur, le rovine romane su uno sperone roccioso con vista mozzafiato sul golfo.\n🥪 Pranzo semplice (panino) a Terracina.", "P": "Spiaggia di Levante, ai piedi del promontorio del tempio — sabbia dorata finissima, acqua bassa, Bandiera Blu.", "S": "ultima serata a Sabaudia.\n🐟 Il ristorante di pesce sul lungomare che conoscete già."}, {"id": "d5", "title": "Sabaudia → Baia → Ischia (Mer 2 settembre)", "links": [{"label": "Sabaudia", "url": "https://maps.apple.com/?ll=41.3009,13.0269&q=Sabaudia"}, {"label": "Baia", "url": "https://maps.apple.com/?ll=40.8236,14.1219&q=Baia%20/%20Pozzuoli"}, {"label": "Pozzuoli", "url": "https://maps.apple.com/?ll=40.8236,14.1219&q=Baia%20/%20Pozzuoli"}, {"label": "Barano", "url": "https://maps.apple.com/?ll=40.7213,13.9114&q=Barano%20d%27Ischia"}, {"label": "Piscina Mirabile", "url": "https://maps.apple.com/?ll=40.7908,14.0842&q=Piscina%20Mirabile"}], "M": "checkout dal campeggio, trasferimento da Sabaudia verso Baia (~2h), in tempo per l'immersione/snorkeling guidata dalle 12:00 alle 14:30 nel Parco Archeologico Sommerso di Baia.", "P": "Piscina Mirabile a Bacoli — la più grande cisterna romana d'epoca imperiale, la \"Cattedrale dell'Acqua\" (visita guidata di 45 min); se le Cento Camerelle sono riaperte, sono a 400m e si vedono con lo stesso biglietto cumulativo. Poi tempo libero prima dell'imbarco.\n🥪 Pranzo semplice (panino) in zona Pozzuoli.", "S": "traghetto Pozzuoli → Ischia delle 19:00, arrivo alle 20:05, check-in e sistemazione.\n🍕 Pizza da Rosa dei Venti a Barano — gourmet, ingredienti locali, comoda per la prima sera."}, {"id": "d6", "title": "Ischia (Gio 3 settembre)", "links": [{"label": "Barano", "url": "https://maps.apple.com/?ll=40.7213,13.9114&q=Barano%20d%27Ischia"}, {"label": "Maronti", "url": "https://maps.apple.com/?ll=40.6980,13.8990&q=Maronti%20/%20Sant%27Angelo"}, {"label": "Sant'Angelo", "url": "https://maps.apple.com/?ll=40.6980,13.8990&q=Maronti%20/%20Sant%27Angelo"}], "M": "spesa con piccola visita a Barano/Testaccio.\n🥐 Colazione in un bar del paese.", "P": "mare alla spiaggia dei Maronti (auto dalla strada panoramica da Testaccio, parcheggi custoditi nei dintorni).\n🍷 Aperitivo con vista in uno dei locali di Sant'Angelo.\nDentro la stessa baia, zona Cavascura: le Fumarole, sabbia calda naturale per l'effetto termale — se volete, ci si arriva a piedi lungo la spiaggia.", "S": "Monte Epomeo al tramonto — si parte da Fontana (Barano, comodo da casa), salita di circa 1h e discesa di 40-50 min, vista a 360° sull'isola; in alternativa, la solita passeggiata nel borgo di Sant'Angelo.\n🔥 Cena a casa con grigliata."}, {"id": "d7", "title": "Ischia (Ven 4 settembre)", "links": [{"label": "Giardini Poseidon", "url": "https://maps.apple.com/?ll=40.7080,13.8590&q=Giardini%20Poseidon"}, {"label": "Forio", "url": "https://maps.apple.com/?ll=40.7386,13.8583&q=Forio"}], "M": "Giardini Poseidon o Negombo, giornata intera (apertura 9:00).\n🥐 Colazione da Divino Cafè (Forio) — ottimi cornetti, babà e cannoli, prima di entrare alle terme.", "P": "ancora Giardini Poseidon (accesso incluso anche alla spiaggia di Citara, sotto il parco), fino alla chiusura alle 19:00.", "S": "relax serale a Forio, passeggiata sul lungomare.\n🍷 Aperitivo tardo a Forio."}, {"id": "d8", "title": "Ischia → Procida → Ischia (Sab 5 settembre)", "links": [{"label": "Procida", "url": "https://maps.apple.com/?ll=40.7597,14.0206&q=Procida"}], "M": "traghetto da Ischia a Procida, arrivo a Marina Grande. Passeggiata veloce nella zona del porto — Via Roma, le casette colorate, Chiesa della Madonna della Pietà. Bus verso Chiaiolella: passeggiata sul lungomare verso Ciraccio, con vista su Vivara e i faraglioni (Vivara si guarda da qui, non serve visitarla a parte). Bus di rientro verso Terra Murata: Piazza dei Martiri, Santuario di Santa Maria delle Grazie, Belvedere dei Cannoni (vista sulla Corricella), Abbazia di San Michele.\n🥐 Caffè con lingua di bue (il dolce tipico di Procida) al Bar Pasticceria Roma (Via Roma 164) — il locale originale dove è stata inventata negli anni '50, considerato il migliore dell'isola.\nPalazzo d'Avalos (ex carcere borbonico), a Terra Murata: probabilmente la visita culturale più interessante dell'isola (~1 ora), ma solo se prenotata in anticipo — altrimenti si salta senza problemi e si prosegue verso la Corricella.", "P": "discesa a piedi da Terra Murata verso Marina Corricella (uno dei tratti più belli dell'isola: case color pastello, scalinate, scorci sul mare), pranzo in uno dei ristoranti sul porticciolo. Poi salita e discesa verso la Spiaggia della Chiaia (la famosa scalinata di 186 gradini), bagno e relax.\n🐟 Pranzo alla Corricella — pasta al limone di Procida, pesce fresco/alici/paranza fritta, granita al limone.", "S": "risalita verso Marina Grande, tempo libero sul porto di Procida prima dell'imbarco, traghetto di rientro a Ischia, poi tramonto sulla Spiaggia dei Pescatori con il Castello Aragonese sullo sfondo (la visita completa è il 9 settembre, con più calma)."}, {"id": "d9", "title": "Ischia (Dom 6 settembre)", "links": [{"label": "Giardino La Mortella", "url": "https://maps.apple.com/?ll=40.7370,13.8600&q=Giardino%20La%20Mortella"}, {"label": "Forio", "url": "https://maps.apple.com/?ll=40.7386,13.8583&q=Forio"}, {"label": "San Montano", "url": "https://maps.apple.com/?ll=40.7550,13.8870&q=San%20Montano"}], "M": "Giardino La Mortella a Forio (aperto la domenica, 9:00-19:00 — prevedere 2-3 ore), poi trasferimento verso la Baia di San Montano — c'è un parcheggio vicino alla baia, ma in alta stagione conviene arrivare presto per trovare posto.\n🥐 Colazione in un bar a Forio, prima di entrare a La Mortella.\nSulla strada verso San Montano: il Fungo di Lacco Ameno, la celebre roccia vulcanica a forma di fungo sul lungomare — bastano 5-10 minuti per una foto.", "P": "mare con calma a San Montano, snorkeling libero.", "S": "relax serale, rientro verso Forio per cena.\n🍕 Pizza da Zi Carmela a Forio — storica, vicino al porticciolo."}, {"id": "d10", "title": "Ischia → Capri → Ischia (Lun 7 settembre)", "links": [{"label": "Capri", "url": "https://maps.apple.com/?ll=40.5532,14.2429&q=Capri"}, {"label": "Marina Grande", "url": "https://maps.apple.com/?ll=40.5532,14.2429&q=Capri"}, {"label": "Anacapri", "url": "https://maps.apple.com/?ll=40.5532,14.2429&q=Capri"}, {"label": "Chiesa di San Michele", "url": "https://maps.apple.com/?ll=40.5546,14.2260&q=Chiesa%20di%20San%20Michele"}, {"label": "Monte Solaro", "url": "https://maps.apple.com/?ll=40.5490,14.2130&q=Monte%20Solaro"}, {"label": "Piazza Vittoria", "url": "https://maps.apple.com/?ll=40.5545,14.2255&q=Piazza%20Vittoria"}, {"label": "Casa Rossa", "url": "https://maps.apple.com/?ll=40.5580,14.2280&q=Casa%20Rossa"}, {"label": "Certosa di San Giacomo", "url": "https://maps.apple.com/?ll=40.5497,14.2445&q=Certosa%20di%20San%20Giacomo"}, {"label": "Belvedere di Tragara", "url": "https://maps.apple.com/?ll=40.5460,14.2470&q=Belvedere%20di%20Tragara"}, {"label": "Arco Naturale", "url": "https://maps.apple.com/?ll=40.5461,14.2586&q=Arco%20Naturale"}], "M": "traghetto da Ischia Porto, arrivo a Marina Grande. Bus verso Anacapri, giro veloce del centro. Poi bus da Anacapri verso Capri centro.\n🥐 Cornetto da Bar Calise a Ischia Porto, prima di imbarcarvi (storico dal 1925, il bar simbolo di Ischia).\nAd Anacapri, se resta tempo: Villa San Michele (giardini e vista sul golfo) Chiesa di San Michele (pavimento in maiolica dipinta) Monte Solaro in seggiovia Piazza Vittoria e Via Giuseppe Orlandi Casa Rossa", "P": "Giardini di Augusto (vista su Via Krupp e sui Faraglioni), poi discesa panoramica per Via Krupp fino alla Scogliera dell'Arsenale/Marina Piccola (verificare che sia aperta) — bagno e pranzo con calma. Al passaggio in centro, torta caprese da Buonocore da portare con voi per Marina Piccola.\n🍰 Torta caprese e gelato alla Pasticceria Buonocore (Via Vittorio Emanuele 35, vicino alla Piazzetta), da gustare a Marina Piccola dopo pranzo.\nA Capri centro, se resta tempo: Certosa di San Giacomo Via Camerelle Belvedere di Tragara Arco Naturale", "S": "risalita verso Marina Grande per le 14:00 — Giro dell'Isola in barca (~2 ore) + sosta alla Grotta Azzurra, poi traghetto di rientro a Ischia.\n🍽️ Cena a Ischia al rientro.\nPer una cena tipica con coniglio all'ischitana: Il Focolare (Barano d'Ischia, via Cretaio — familiare, immerso nel verde) o La Vigna di Alberto (Barano d'Ischia, via Giuseppe Garibaldi 57 — atmosfera intima, prodotti a km 0), entrambi comodi da casa."}, {"id": "d11", "title": "Ischia (Mar 8 settembre)", "links": [{"label": "Forio", "url": "https://maps.apple.com/?ll=40.7386,13.8583&q=Forio"}, {"label": "Spiaggia di San Francesco", "url": "https://maps.apple.com/?ll=40.7350,13.8480&q=Spiaggia%20di%20San%20Francesco"}, {"label": "Sorgeto", "url": "https://maps.apple.com/?ll=40.7030,13.8670&q=Panza%20/%20Sorgeto"}, {"label": "Panza", "url": "https://maps.apple.com/?ll=40.7030,13.8670&q=Panza%20/%20Sorgeto"}], "M": "piccola visita alla Chiesa del Soccorso e al lungomare di Forio, poi mare alla Spiaggia di San Francesco (pochi minuti a piedi dal centro, facile in auto).\n🥐 Colazione da Divino Cafè (Forio) — ottimi cornetti, babà e cannoli.", "P": "ancora mare a San Francesco, oppure Giardini Ravino (Citara) — giardino di piante grasse e cactus, con pavoni liberi e installazioni d'arte, molto diverso da La Mortella; aperto tutti i giorni tranne martedì e giovedì, 10€ a persona.", "S": "Baia di Sorgeto — pozze termali naturali sugli scogli, zona libera e gratuita, suggestiva al tramonto (zona Panza, pochi minuti da Citara)."}, {"id": "d12", "title": "Ischia (Mer 9 settembre)", "links": [{"label": "Spiaggia di Cartaromana", "url": "https://maps.apple.com/?ll=40.7395,13.9560&q=Cartaromana"}, {"label": "Ischia Ponte", "url": "https://maps.apple.com/?ll=40.7360,13.9581&q=Ischia%20Ponte"}, {"label": "Castello Aragonese", "url": "https://maps.apple.com/?ll=40.7333,13.9575&q=Castello%20Aragonese"}], "M": "ultimo mare con calma alla Spiaggia di Cartaromana (Ischia Ponte) — piccola baia di sabbia e ciottoli con sorgenti termali naturali, vista sul Castello Aragonese.\n🥐 Colazione da Bar Ciccio a Ischia Ponte (Piazza Antica Reggia) — ottimi brioches.", "P": "visita completa al Castello Aragonese di Ischia Ponte (1h30-2h con calma) — Terrazzo dell'Immacolata, Chiesa dell'Immacolata, il cimitero delle Monache Clarisse, gallerie scavate nella roccia.\n🍨 Gelato artigianale nel borgo di pescatori, dopo la visita (gusti locali: limone di Ischia, fico bianco).", "S": "relax serale nel borgo di pescatori di Ischia Ponte.\n🍸 Un ultimo drink come saluto a Ischia."}, {"id": "d13", "title": "Ischia → Pozzuoli → Ravello (Gio 10 settembre)", "links": [{"label": "Pozzuoli", "url": "https://maps.apple.com/?ll=40.8236,14.1219&q=Baia%20/%20Pozzuoli"}, {"label": "Ravello", "url": "https://maps.apple.com/?ll=40.6492,14.6114&q=Ravello"}, {"label": "Scala", "url": "https://maps.apple.com/?ll=40.6447,14.5964&q=Scala"}, {"label": "Villa Rufolo", "url": "https://maps.apple.com/?ll=40.6493,14.6117&q=Villa%20Rufolo"}, {"label": "Villa Cimbrone", "url": "https://maps.apple.com/?ll=40.6400,14.6066&q=Villa%20Cimbrone"}], "M": "traghetto Ischia → Pozzuoli delle 11:30, arrivo alle 12:30.", "P": "guida verso la Costiera Amalfitana (uscita autostradale consigliata a Salerno), arrivo a Scala (dove alloggiate, pochi minuti da Ravello), check-in, poi Villa Rufolo e Villa Cimbrone (Terrazza dell'Infinito) nel tardo pomeriggio — la luce di quell'ora è ideale per il panorama.\n🥪 Pranzo semplice (panino) durante il viaggio.", "S": "spesa per la casa, giro del paese di Scala e passeggiata nel centro storico."}, {"id": "d14", "title": "Ravello (Ven 11 settembre)", "links": [{"label": "Ravello", "url": "https://maps.apple.com/?ll=40.6492,14.6114&q=Ravello"}, {"label": "Amalfi", "url": "https://maps.apple.com/?ll=40.6340,14.6027&q=Amalfi"}, {"label": "Atrani", "url": "https://maps.apple.com/?ll=40.6323,14.6108&q=Atrani"}, {"label": "Duomo di Amalfi", "url": "https://maps.apple.com/?ll=40.634,14.6027&q=Duomo%20di%20Amalfi"}], "M": "ad Amalfi: Duomo di Amalfi (Cattedrale di Sant'Andrea) e Chiostro del Paradiso, poi Atrani — il borgo più piccolo della costiera, a 5 minuti a piedi da Amalfi, quasi nessun turista ci arriva.\n🥐 Colazione (pasticciotto) alla Pasticceria Andrea Pansa in Piazza Duomo — storica dal 1830. Se lo trovate, anche un sorbetto da A'Sciulia.", "P": "boat tour della Costiera delle 14:30 da Amalfi (rientro dopo circa 2 ore) — grotte, spiagge raggiungibili solo dal mare, bagno.", "S": "rientro a Ravello, passeggiata nel centro storico.\n🍷 Drink in piazza nel centro storico."}, {"id": "d15", "title": "Ravello (Sab 12 settembre)", "links": [{"label": "Ravello", "url": "https://maps.apple.com/?ll=40.6492,14.6114&q=Ravello"}, {"label": "Sentiero degli Dei", "url": "https://maps.apple.com/?ll=40.6250,14.5000&q=Sentiero%20degli%20Dei"}, {"label": "Nocelle", "url": "https://maps.apple.com/?ll=40.6193,14.4703&q=Nocelle"}, {"label": "Positano", "url": "https://maps.apple.com/?ll=40.6280,14.4848&q=Positano"}, {"label": "Amalfi", "url": "https://maps.apple.com/?ll=40.6340,14.6027&q=Amalfi"}], "M": "Sentiero degli Dei (Bomerano–Nocelle, ~5 km, circa 3 ore), partenza presto la mattina — sosta a Nocelle, il piccolo borgo alla fine del sen     diaryState[d.id] = { M: d.M, P: d.P, S: d.S, by: '', ts: 0 };
  });
  SEED.expenses.forEach(e => {

  });

function syncStatusMsg(msg, isErr) {
  const el = document.getElementById('syncStatus');
  if (el) { el.textContent = msg; el.className = 'sync-status' + (isErr ? ' err' : ''); }
}

function attachSync() {
  if (!firebaseReady) {
    syncStatusMsg('Firebase non configurato: le modifiche restano solo su questo telefono. Vedi le istruzioni per collegare il database condiviso.', true);
    return;
  }
  db.ref('diary').on('value', snap => {
    const val = snap.val() || {};
    SEED.days.forEach(d => { if (val[d.id]) diaryState[d.id] = val[d.id]; });
    renderDiary();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  db.ref('expenses').on('value', snap => {
    const val = snap.val() || {};
    SEED.expenses.forEach(e => {
      if (val[e.id]) {
        if (val[e.id].actual !== undefined) expenseState[e.id].actual = val[e.id].actual;
        if (val[e.id].label) e.label = val[e.id].label;
      }
    });
    Object.keys(val).forEach(id => {
      if (!SEED.expenses.find(e => e.id === id) && val[id].label) {
        expenseState[id] = val[id];
        SEED.expenses.push({ id, catId: val[id].catId, label: val[id].label, estMin: val[id].estMin, estMax: val[id].estMax });
      }
    });
    SEED.expenses = SEED.expenses.filter(e => !e.id.startsWith('custom_') || val[e.id]);
    renderExpenses();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  db.ref('expCats').on('value', snap => {
    const val = snap.val() || {};
    SEED.expCats.forEach(c => { if (val[c.id]) c.name = val[c.id]; });
    Object.keys(val).forEach(id => {
      if (!SEED.expCats.find(c => c.id === id)) SEED.expCats.push({ id, name: val[id] });
    });
    SEED.expCats = SEED.expCats.filter(c => val[c.id] !== undefined || !c.id.includes('_'));
    renderExpenses();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  db.ref('packing').on('value', snap => {
    const val = snap.val() || {};
    SEED.packing.forEach(p => {
      if (val[p.id]) {
        if (val[p.id].A !== undefined || val[p.id].B !== undefined) packState[p.id] = { A: !!val[p.id].A, B: !!val[p.id].B };
        if (val[p.id].label) p.label = val[p.id].label;
      }
    });
    // remote-added custom items
    Object.keys(val).forEach(id => {
      if (!SEED.packing.find(p => p.id === id) && val[id].label) {
        SEED.packing.push({ id, catId: val[id].catId, label: val[id].label });
        packState[id] = { A: !!val[id].A, B: !!val[id].B };
      }
    });
    // remote-deleted custom items (only custom ones, never touch the baseline list)
    SEED.packing = SEED.packing.filter(p => !p.id.startsWith('pcustom_') || val[p.id]);
    renderPacking();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  db.ref('packCats').on('value', snap => {
    const val = snap.val() || {};
    SEED.packCats.forEach(c => { if (val[c.id]) c.name = val[c.id]; });
    Object.keys(val).forEach(id => {
      if (!SEED.packCats.find(c => c.id === id)) SEED.packCats.push({ id, name: val[id] });
    });
    SEED.packCats = SEED.packCats.filter(c => val[c.id] !== undefined || !c.id.includes('_'));
    renderPacking();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  db.ref('food').on('value', snap => {
    const val = snap.val() || {};

    });
    // remote-added custom items
    Object.keys(val).forEach(id => {
      if (!SEED.food.find(f => f.id === id) && val[id].label) {
        SEED.food.push({ id, catId: val[id].catId, label: val[id].label });
        foodState[id] = val[id];
      }
    });
    // remote-deleted custom items (only custom ones, never touch the baseline list)
    SEED.food = SEED.food.filter(f => !f.id.startsWith('fcustom_') || val[f.id]);
    renderFood();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  db.ref('foodCats').on('value', snap => {
    const val = snap.val() || {};
    SEED.foodCats.forEach(c => { if (val[c.id]) c.name = val[c.id]; });
    Object.keys(val).forEach(id => {
      if (!SEED.foodCats.find(c => c.id === id)) SEED.foodCats.push({ id, name: val[id] });
    });
    SEED.foodCats = SEED.foodCats.filter(c => val[c.id] !== undefined || !c.id.includes('_'));
    renderFood();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  syncStatusMsg('Connesso — le modifiche si vedono su entrambi i telefoni.', false);
}

function debounce(fn, wait) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function linkify(text, links, used) {
  used = used || new Set();
  let escaped = escapeHtml(text);
  const placeholders = {};
  let counter = 0;
  const sorted = [...links].sort((a, b) => b.label.length - a.label.length);
  sorted.forEach(l => {
    if (used.has(l.label)) return;
    const re = new RegExp('(?<![A-Za-zÀ-ÿ\'])' + escapeRegex(l.label) + '(?![A-Za-zÀ-ÿ])', 'g');
    let matchedOnce = false;
    escaped = escaped.replace(re, (match) => {
      if (matchedOnce) return match;
      matchedOnce = true;
      used.add(l.label);
      const key = '@@LINK' + (counter++) + '@@';
      placeholders[key] = `<a class="place-link" href="${l.url}" target="_blank" rel="noopener">${match}</a>`;
      return key;
    });
  });
  Object.keys(placeholders).forEach(k => { escaped = escaped.split(k).join(placeholders[k]); });
  return escaped;
}

function getDayUsedSetUpTo(dayId, stopField) {
  // Walks the day's content in reading order (M, P, S)
  // and marks place labels as "used" up to (but not including) the given field.
  const d = SEED.days.find(x => x.id === dayId);
  const used = new Set();
  const order = ['M', 'P', 'S'];
  for (const f of order) {
    if (stopField === f) return used;
    linkify(diaryState[dayId][f] || '', d.links, used);
  }
  return used;
}

/* ---------------------- Swipe to delete (iOS Mail style) ---------------------- */
function attachSwipeToDelete(container) {
  if (container.dataset.swipeAttached === '1') return;
  container.dataset.swipeAttached = '1';
  const OPEN_THRESHOLD = -40;
  let activeContent = null, activeMax = -84, startX = 0, baseX = 0, dx = 0, dragging = false, moved = false;

  container.addEventListener('pointerdown', e => {
    const wrap = e.target.closest('.swipe-wrap');
    if (!wrap) return;
    if (e.target.closest('.swipe-actions-bg')) return;
    container.querySelectorAll('.swipe-content.swiped').forEach(el => {
      const w = el.closest('.swipe-wrap');
      if (!w || w !== wrap) { el.style.transform = ''; el.classList.remove('swiped'); }
    });
    activeContent = wrap.querySelector('.swipe-content');
    const bg = wrap.querySelector('.swipe-actions-bg');
    activeMax = bg ? -bg.offsetWidth : -84;
    startX = e.clientX;
    baseX = activeContent.classList.contains('swiped') ? activeMax : 0;
    dx = baseX;
    dragging = true;
    moved = false;
    activeContent.style.transition = 'none';
  });

  container.addEventListener('pointermove', e => {
    if (!dragging || !activeContent) return;
    const delta = e.clientX - startX;
    if (Math.abs(delta) > 6) moved = true;
    dx = baseX + delta;
    if (dx > 0) dx = 0;
    if (dx < activeMax) dx = activeMax;
    activeContent.style.transform = `translateX(${dx}px)`;
  });

  function endDrag() {
    if (!dragging || !activeContent) { dragging = false; return; }
    dragging = false;
    activeContent.style.transition = 'transform 0.2s ease';
    if (dx < OPEN_THRESHOLD) {
      activeContent.style.transform = `translateX(${activeMax}px)`;
      activeContent.classList.add('swiped');
    } else {
      activeContent.style.transform = '';
      activeContent.classList.remove('swiped');
    }
    activeContent = null;
  }
  container.addEventListener('pointerup', endDrag);
  container.addEventListener('pointercancel', endDrag);

  container.addEventListener('click', e => {
    const actBtn = e.target.closest('.swipe-act');
    if (actBtn) {
      const wrap = actBtn.closest('.swipe-wrap');
      const content = wrap.querySelector('.swipe-content');
      if (content) { content.style.transform = ''; content.classList.remove('swiped'); }
      window[actBtn.dataset.fn](actBtn.dataset.id);
      return;
    }
    const openContent = e.target.closest('.swipe-content.swiped');
    if (openContent && moved === false) {
      // tap while open just closes it, don't trigger underlying controls
      e.preventDefault();
      e.stopPropagation();
      openContent.style.transition = 'transform 0.2s ease';
      openContent.style.transform = '';
      openContent.classList.remove('swiped');
    }
  }, true);
}

  const [listKey, catId] = combined.split('|');
  const itemsArr = ITEMS_KEY[listKey];
  const stateObj = window[STATE_KEY[listKey]];
  const toDelete = SEED[itemsArr].filter(i => i.catId === catId);
  toDelete.forEach(i => {
    const idx = SEED[itemsArr].indexOf(i);
    if (idx > -1) SEED[itemsArr].splice(idx, 1);
    if (firebaseReady) db.ref(itemsArr + '/' + i.id).remove();
    delete stateObj[i.id];
  });
  const idx2 = SEED[listKey].findIndex(c => c.id === catId);
  if (idx2 > -1) SEED[listKey].splice(idx2, 1);

  return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fmtEuroPlain(n) { return n == null ? '—' : (Number.isInteger(n) ? n : n.toFixed(2)); }
function fmtEuro(n) { return n == null ? '—' : fmtEuroPlain(n) + '€'; }

function addExpense(catId) {
  const labelEl = document.getElementById('newlabel-' + catId);
  const amtEl = document.getElementById('newamt-' + catId);
  const label = labelEl.value.trim();
  const amt = parseFloat(amtEl.value);
  if (!label) return;
  const id = 'custom_' + Date.now();
  const item = { id, catId, label, estMin: isNaN(amt) ? 0 : amt, estMax: isNaN(amt) ? 0 : amt, actual: isNaN(amt) ? null : amt };
  SEED.expenses.push(item);
  saveExpenseNew(item);
  addFormOpen.delete('exp-' + catId);
  renderExpenses();
}

function renderExpTotals() {
  let estTotalMin = 0, estTotalMax = 0, actualTotal = 0, actualCount = 0;
  SEED.expenses.forEach(e => {
    const st = expenseState[e.id] || {};
    if (st.actual != null && !isNaN(st.actual)) {
      actualTotal += st.actual;
      actualCount++;
    } else {
      estTotalMin += (e.estMin || 0);
      estTotalMax += (e.estMax != null ? e.estMax : e.estMin || 0);
    }
  });
  const grandMin = estTotalMin + actualTotal;
  const grandMax = estTotalMax + actualTotal;
  document.getElementById('expEstTotal').textContent = grandMin === grandMax ? fmtEuro(grandMin) : `${fmtEuro(grandMin)}–${fmtEuro(grandMax)}`;
  document.getElementById('expActualTotal').textContent = fmtEuro(actualTotal) + (actualCount ? ` (${actualCount} voci confermate)` : '');
  document.getElementById('expRemaining').textContent = estTotalMin === estTotalMax ? fmtEuro(estTotalMin) : `${fmtEuro(estTotalMin)}–${fmtEuro(estTotalMax)}`;
}

/* ---------------------- Da portare ---------------------- */
function renderPacking() {
  const c = document.getElementById('packCategories');
  c.innerHTML = SEED.packCats.map(cat => {
    const items = SEED.packing.filter(p => p.catId === cat.id);
    return `<div class="pack-cat">${catHeaderHtml(cat, 'packCats')}${items.map(p => packItemHtml(p)).join('')}
      ${packAddRowHtml(cat.id)}
    </div>`;
  }).join('');
  document.getElementById('packCatAddArea').innerHTML = catAddAreaHtml('packCats');
  attachSwipeToDelete(c);
}

function packAddRowHtml(catId) {
  const key = 'pack-' + catId;
  if (!addFormOpen.has(key)) {
    return `<button class="add-link" onclick="openPackAdd('${catId}')">+ Aggiungi</button>`;
  }
  return `
    <div class="add-row">
      <input type="text" placeholder="Nuovo oggetto…" id="newpack-${catId}"
        onkeydown="if(event.key==='Enter'){addPackItem('${catId}');}">
      <button onclick="addPackItem('${catId}')">+</button>
    </div>
  `;
}

function openPackAdd(catId) {
  addFormOpen.add('pack-' + catId);
  renderPacking();
  setTimeout(() => {
    const el = document.getElementById('newpack-' + catId);
    if (el) el.focus();
  }, 60);
}

function packItemHtml(p) {
  const key = 'pack-label-' + p.id;
  const st = packState[p.id] || { A: false, B: false };
  let doneClass = '';
  if (st.A && st.B) doneClass = 'is-done done-both';
  else if (st.A) doneClass = 'is-done done-a';
  else if (st.B) doneClass = 'is-done done-b';
  const labelHtml = editingRows.has(key)
    ? `<input type="text" class="inline-edit-input" autofocus value="${escapeAttrValue(p.label)}"
        onblur="finishEditPackLabel('${p.id}', this.value)"
        onkeydown="if(event.key==='Enter'){this.blur();}">`
    : `<span class="p-label ${doneClass}" onclick="togglePackMe('${p.id}')">${p.label}</span>`;
  return `
    <div class="swipe-wrap" id="packrow-${p.id}">
      <div class="swipe-actions-bg">
        <button class="swipe-act act-edit" data-fn="startEditPackLabel" data-id="${p.id}">Modifica</button>
        <button class="swipe-act act-delete" data-fn="deletePackItem" data-id="${p.id}">Elimina</button>
      </div>
      <div class="swipe-content item-cell pack-item">
        ${labelHtml}
        <div class="p-who">
          <span class="p-who-dot who-a ${st.A ? 'on' : ''}" title="${PERSON_A}"></span>
          <span class="p-who-dot who-b ${st.B ? 'on' : ''}" title="${PERSON_B}"></span>
        </div>
      </div>
    </div>
  `;
}

function startEditPackLabel(id) {
  editingRows.add('pack-label-' + id);
  renderPackingItem(id);
}

function finishEditPackLabel(id, value) {
  editingRows.delete('pack-label-' + id);
  const label = value.trim();
  if (label) {
    const p = SEED.packing.find(x => x.id === id);
    if (p) p.label = label;
    if (!packState[id]) packState[id] = { A: false, B: false };
    const payload = { A: !!packState[id].A, B: !!packState[id].B, label, catId: p ? p.catId : undefined };
    if (firebaseReady) db.ref('packing/' + id).set(payload);
  }
  renderPackingItem(id);
}

function addPackItem(catId) {
  const input = document.getElementById('newpack-' + catId);
  const label = input.value.trim();
  if (!label) return;
  const id = 'pcustom_' + Date.now();
  const item = { id, catId, label };
  SEED.packing.push(item);
  packState[id] = { A: false, B: false };
  if (firebaseReady) db.ref('packing/' + id).set(Object.assign({ label, catId }, packState[id]));
  addFormOpen.delete('pack-' + catId);
  renderPacking();
}

function deletePackItem(id) {
  const idx = SEED.packing.findIndex(p => p.id === id);
  if (idx > -1) SEED.packing.splice(idx, 1);
  delete packState[id];
  if (firebaseReady) db.ref('packing/' + id).remove();
  renderPacking();
}

function renderPackingItem(id) {
  const el = document.getElementById('packrow-' + id);
  if (!el) return;
  const p = SEED.packing.find(x => x.id === id);
  if (!p) return;
  el.outerHTML = packItemHtml(p);
}

/* ---------------------- Da assaggiare ---------------------- */
function renderFood() {
  const c = document.getElementById('foodCategories');
  c.innerHTML = SEED.foodCats.map(cat => {
    const items = SEED.food.filter(f => f.catId === cat.id);
    return `<div class="food-cat">${catHeaderHtml(cat, 'foodCats')}${items.map(f => foodItemHtml(f)).join('')}
      ${foodAddRowHtml(cat.id)}
    </div>`;
  }).join('');
  document.getElementById('foodCatAddArea').innerHTML = catAddAreaHtml('foodCats');
  attachSwipeToDelete(c);
}

function foodAddRowHtml(catId) {
  const key = 'food-' + catId;
  if (!addFormOpen.has(key)) {
    return `<button class="add-link" onclick="openFoodAdd('${catId}')">+ Aggiungi</button>`;
  }
  return `
    <div class="add-row">
      <input type="text" placeholder="Nuovo piatto/luogo…" id="newfood-${catId}"
        onkeydown="if(event.key==='Enter'){addFoodItem('${catId}');}">
      <button onclick="addFoodItem('${catId}')">+</button>
    </div>
  `;
}

function openFoodAdd(catId) {
  addFormOpen.add('food-' + catId);
  renderFood();
  setTimeout(() => {
    const el = document.getElementById('newfood-' + catId);
    if (el) el.focus();
  }, 60);
}

function foodItemHtml(f) {
  const key = 'food-' + f.id;
  const label = (foodState[f.id] || {}).label ?? f.label;
  const inner = editingRows.has(key)
    ? `<input type="text" class="inline-edit-input" autofocus value="${escapeAttrValue(label)}"
        onblur="finishEditFood('${f.id}', this.value)"
        onkeydown="if(event.key==='Enter'){this.blur();}">`
    : `<span class="food-label">${escapeHtml(label)}</span>`;
  return `
    <div class="swipe-wrap" id="foodrow-${f.id}">
      <div class="swipe-actions-bg">
        <button class="swipe-act act-edit" data-fn="startEditFood" data-id="${f.id}">Modifica</button>
        <button class="swipe-act act-delete" data-fn="deleteFoodItem" data-id="${f.id}">Elimina</button>
      </div>
      <div class="swipe-content item-cell food-item">${inner}</div>
    </div>
  `;
}

function startEditFood(id) {
  editingRows.add('food-' + id);
  refreshFoodItem(id);
}

function finishEditFood(id, value) {
  editingRows.delete('food-' + id);
  const label = value.trim();
  if (label) {
    foodState[id] = { label };
    const f = SEED.food.find(x => x.id === id);
    if (f) f.label = label;
    if (firebaseReady) db.ref('food/' + id).set({ label, catId: f ? f.catId : undefined });
  }
  refreshFoodItem(id);
}

function refreshFoodItem(id) {
  const el = document.getElementById('foodrow-' + id);
  const f = SEED.food.find(x => x.id === id);
  if (el && f) el.outerHTML = foodItemHtml(f);
}

function addFoodItem(catId) {
  const input = document.getElementById('newfood-' + catId);
  const label = input.value.trim();
  if (!label) return;
  const id = 'fcustom_' + Date.now();
  const item = { id, catId, label };
  SEED.food.push(item);
  foodState[id] = { label };
  if (firebaseReady) db.ref('food/' + id).set({ label, catId });
  addFormOpen.delete('food-' + catId);
  renderFood();
}

function deleteFoodItem(id) {
  const idx = SEED.food.findIndex(f => f.id === id);
  if (idx > -1) SEED.food.splice(idx, 1);
  delete foodState[id];
  if (firebaseReady) db.ref('food/' + id).remove();
  renderFood();
}

/* ---------------------- Navigation ---------------------- */
const NO_TOPBAR_VIEWS = ['spese', 'portare', 'assaggiare'];
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    document.getElementById('topbar').style.display = NO_TOPBAR_VIEWS.includes(btn.dataset.view) ? 'none' : 'flex';
  });
});

/* ---------------------- Who am I ---------------------- */
const whoModal = document.getElementById('whoModal');
const whoBtn = document.getElementById('whoBtn');
const whoLabelEl = document.getElementById('whoLabel');
const whoDotEl = document.getElementById('whoDot');
const PERSON_COLORS = { A: '#0969da', B: '#c07a1e' };

function setWho(p) {
  me = p;
  localStorage.setItem('vacanza2026_who', p);
  whoLabelEl.textContent = p === 'A' ? PERSON_A : PERSON_B;
  whoDotEl.style.background = PERSON_COLORS[p];
  whoModal.classList.remove('show');
}

document.querySelectorAll('.who-pick').forEach(b => b.addEventListener('click', () => setWho(b.dataset.person)));
whoBtn.addEventListener('click', () => whoModal.classList.add('show'));

if (me) { setWho(me); }
else { whoModal.classList.add('show'); }

renderCalendar();
renderDiary();
renderExpenses();
renderPacking();
renderFood();
attachSync();

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const active = document.activeElement;
    if (active && active.tagName === 'TEXTAREA') {
      setTimeout(() => { active.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
    }
  });
}
