<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Capodanno 2027 — Germania e Austria</title>
<style>
  :root {
    --ink: #24292e;
    --ink-soft: #57606a;
    --line: #d0d7de;
    --bg: #ffffff;
    --accent: #0969da;
    --paid: #2e7d46;
    --paid-bg: #eaf5ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f6f8fa;
    color: var(--ink);
    padding-bottom: 84px;
  }
  h1, h2, h3 { margin: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 15;
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 0.85rem 1rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 1.1rem; font-weight: 700; }
  .who-btn {
    background: #f6f8fa;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 0.4rem 0.7rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .who-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 1rem; }
  .view { display: none; }
  .view.active { display: block; }

  /* Diary */
  .calendar-wrap {
    position: sticky;
    top: 57px;
    background: #f6f8fa;
    padding: 0.7rem 0 0.6rem;
    margin-bottom: 0.8rem;
    z-index: 9;
    border-bottom: 1px solid var(--line);
  }
  .calendar-caption { font-weight: 600; text-align: center; margin: 0 0 .55rem; color: var(--ink-soft); font-size: .78rem; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-wd { font-size: 0.72rem; color: var(--ink-soft); text-align: center; font-weight: 700; padding-bottom: 4px; }
  .cal-cell {
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; color: #c8ccd1;
    border-radius: 50%;
    text-decoration: none;
  }
  .cal-active {
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    font-weight: 700;
    cursor: pointer;
  }
  .cal-active.current {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 2px 6px rgba(9,105,218,0.35);
    transform: scale(1.08);
  }
  .day-card {
    background: var(--bg);
    border-radius: 10px;
    margin-bottom: 1rem;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .day-head-static {
    padding: 0.6rem 0.5rem;
    background: #f6f8fa;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 0.4rem;
  }
  .day-head-mid { flex: 1; text-align: center; min-width: 0; cursor: pointer; }
  .day-head-mid .dtitle { font-weight: 700; font-size: 0.92rem; }
  .day-head-mid .dnum { font-size: 0.68rem; color: var(--accent); font-weight: 600; margin-bottom: 0.1rem; }
  .day-nav-btn {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .day-nav-btn:disabled { color: var(--line); cursor: default; }
  .day-nav-btn:active:not(:disabled) { background: #eef4fc; }
  .day-body { padding: 0.8rem 1rem 1rem; }
  .maps-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.8rem; }
  .maps-chip {
    font-size: 0.74rem;
    color: var(--accent);
    background: #eef4fc;
    border: 1px solid #cfe0f5;
    border-radius: 20px;
    padding: 0.28rem 0.6rem;
    text-decoration: none;
  }
.dayrow { display: flex; gap: 0.6rem; margin-bottom: 0.6rem; align-items: flex-start; }
  .dayrow .rlabel {
    flex: 0 0 24px;
    height: 26px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin-top: 4px;
  }
  .dayrow .swipe-wrap { flex: 1; min-width: 0; margin-bottom: 0; }
  .dayrow textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
    font-family: inherit;
    font-size: 0.88rem;
    line-height: 1.45;
    color: var(--ink);
    background: #fff;
    resize: vertical;
    min-height: 46px;
  }
  .dayrow textarea:focus { outline: none; border-color: var(--accent); }
  .rdisplay {
    flex: 1;
    padding: 0.5rem 0.6rem;
    line-height: 1.45;
    color: var(--ink);
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: text;
  }
  .rdisplay:hover { background: #f6f8fa; border-color: var(--line); }
  .rdisplay .rempty { color: var(--ink-soft); font-style: italic; font-size: 0.88rem; }
  .rline-main { font-size: 0.88rem; color: var(--ink); }
  .rline-note {
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-top: 0.3rem;
    padding-top: 0.3rem;
    border-top: 1px dotted var(--line);
  }
  .rdisplay .place-link {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(9,105,218,0.4);
    text-underline-offset: 2px;
  }
  .diary-meta { font-size: 0.7rem; color: var(--ink-soft); margin-top: 0.5rem; min-height: 1em; }

  /* Full-screen itinerary editor: keeps the day card and page scroll untouched. */
  .diary-editor-modal {
    position: fixed; inset: 0; z-index: 1000;
    display: none; flex-direction: column;
    width: 100%; height: 100vh; height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    background: #fff; color: var(--ink); color-scheme: light;
    overscroll-behavior: contain;
  }
  .diary-editor-modal.show { display: flex; }
  .diary-editor-head {
    flex: 0 0 auto; min-height: 58px;
    display: grid; grid-template-columns: 76px minmax(0, 1fr) 76px;
    align-items: center; gap: .35rem;
    padding: .35rem .7rem;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  .diary-editor-head h2 {
    min-width: 0; text-align: center; font-size: .98rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .diary-editor-head button {
    min-height: 42px; border: 0; border-radius: 9px;
    padding: .45rem .55rem; font: inherit; font-size: .88rem; font-weight: 650;
    cursor: pointer; touch-action: manipulation;
  }
  .diary-editor-cancel { color: var(--ink-soft); background: #f1f3f5; }
  .diary-editor-save { color: #fff; background: var(--accent); }
  .diary-editor-body {
    display: flex; flex: 1 1 auto; min-height: 0; min-width: 0;
    flex-direction: column; gap: .85rem;
    padding: .8rem .85rem 1rem;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .diary-editor-field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
  .diary-editor-field label {
    display: block; font-size: .76rem; line-height: 1.2;
    font-weight: 750; color: var(--ink-soft); letter-spacing: .01em;
  }
  .diary-editor-textarea {
    display: block; width: 100%; min-width: 0; min-height: 0;
    border: 1px solid var(--line); border-radius: 10px;
    padding: .8rem; margin: 0;
    background: #fff !important; color: var(--ink) !important;
    -webkit-text-fill-color: var(--ink) !important;
    font-family: inherit; font-size: 16px; line-height: 1.5;
    resize: none; overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; color-scheme: light; caret-color: var(--accent);
  }
  .diary-editor-main-textarea {
    flex: 0 0 auto; min-height: 88px; font-size: 16px; line-height: 1.45;
    font-weight: 600; color: var(--ink) !important;
    -webkit-text-fill-color: var(--ink) !important;
  }
  .diary-editor-notes-textarea {
    flex: 1 1 auto; min-height: 150px; font-size: 14px; line-height: 1.5;
    color: var(--ink-soft) !important; -webkit-text-fill-color: var(--ink-soft) !important;
    border-top-style: dotted;
  }
  .diary-editor-textarea:focus { outline: 2px solid rgba(9,105,218,.22); border-color: var(--accent); }
  body.diary-editor-locked, body.budget-modal-locked { position: fixed; overflow: hidden; width: 100%; left: 0; right: 0; }
  html.diary-editor-locked, html.budget-modal-locked { overflow: hidden; }

  /* Expenses */
  .exp-hero {
    background: var(--bg);
    border-radius: 10px;
    border: 1px solid var(--line);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .exp-hero-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0.35rem 0; }
  .exp-hero-row .lbl { font-size: 0.85rem; color: var(--ink-soft); }
  .exp-hero-row .val { font-weight: 700; font-size: 1.1rem; }
  .exp-hero-row.grand { border-top: 2px solid var(--ink); margin-top: 0.4rem; padding-top: 0.6rem; }
  .exp-hero-row.grand .val { font-size: 1.4rem; color: var(--accent); }
  .exp-note { font-size: .75rem; line-height: 1.45; color: var(--ink-soft); margin-top: .7rem; }
  .exp-label-group { display: inline-flex; align-items: center; gap: .4rem; }
  .exp-info-btn { display: inline-flex; align-items: center; justify-content: center; width: 23px; height: 23px;
    border: 1px solid #afc5e0; background: #f0f6ff; color: var(--accent); border-radius: 50%;
    font-size: .78rem; font-family: Georgia, serif; font-weight: 700; cursor: pointer; }
  .exp-info-btn:focus-visible, .budget-modal button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .exp-hero-row { gap: .5rem; }
  .exp-hero-row .val { text-align: right; white-space: nowrap; }
  .exp-hero-row .val.negative { color: #c13432; }
  /* Budget editor: true full-screen sheet; only its list scrolls, never the page behind it. */
  .budget-modal-backdrop {
    position: fixed; inset: 0; z-index: 1001; display: none;
    align-items: stretch; justify-content: stretch; padding: 0;
    background: #fff; overscroll-behavior: none; touch-action: none;
  }
  .budget-modal-backdrop.show { display: flex; }
  .budget-modal {
    display: flex; flex-direction: column; width: 100%; height: 100vh; height: 100dvh;
    max-width: none; max-height: none; min-height: 0; overflow: hidden;
    border-radius: 0; padding: calc(.75rem + env(safe-area-inset-top)) .9rem calc(.55rem + env(safe-area-inset-bottom));
    color-scheme: light; color: var(--ink); background: #fff;
    overscroll-behavior: contain; touch-action: pan-y;
  }
  .budget-modal-head { display: flex; flex: 0 0 auto; justify-content: space-between; gap: 1rem; align-items: center; margin-bottom: .5rem; padding-bottom: .65rem; border-bottom: 1px solid var(--line); }
  .budget-modal-head h2 { margin: 0; }
  #budgetEditor {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: .25rem 0 .7rem; touch-action: pan-y;
  }
  .budget-x { font-size: 1.25rem; border: 0; background: #f1f3f5; color: var(--ink); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
  .budget-cat { margin-bottom: 1.1rem; }
  .budget-cat-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-bottom: .4rem;
    padding-bottom: .35rem; border-bottom: 1px solid var(--line); font-size: .83rem; font-weight: 700; }
  .budget-cat-head span:last-child { color: var(--accent); white-space: nowrap; }
  .budget-line { display: flex; align-items: center; gap: .4rem; margin: .4rem 0; }
  .budget-line input { min-width: 0; border: 1px solid var(--line); background: #fff !important; color: #24292e !important; -webkit-text-fill-color: #24292e !important; opacity: 1 !important; caret-color: #0969da; color-scheme: light; padding: .48rem .42rem; border-radius: 7px; font: inherit; font-size: .8rem; }
  .budget-line input[type=text] { flex: 1; }
  .budget-line input[type=number] { flex: 0 0 80px; width: 80px; text-align: right; }
  .budget-remove { border: none; background: #fff1ef; color: #a22f2b; border-radius: 7px; height: 32px; width: 29px; font-size: 1rem; cursor: pointer; }
  .budget-add { color: var(--accent); background: none; border: 0; font-weight: 600; font-size: .79rem; cursor: pointer; padding: .4rem 0; }
  .budget-footer { position: relative; bottom: auto; flex: 0 0 auto; background: #fff; padding: .75rem 0 .15rem; border-top: 1px solid var(--line); }
  .budget-grand { display: flex; justify-content: space-between; align-items: center; font-size: .9rem; font-weight: 700; margin-bottom: .6rem; }
  .budget-grand strong { font-size: 1.15rem; color: var(--accent); }
  .budget-btns { display: flex; gap: .6rem; }
  .budget-btns button { padding: .7rem .85rem; border-radius: 8px; border: 1px solid var(--line); background: #f0f1f3; color: var(--ink); font-weight: 700; font-size: .87rem; cursor: pointer; flex: 1; }
  .budget-btns .budget-save { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media(max-width:375px) { .budget-line input[type=number] { flex-basis: 79px; width: 79px; } .budget-modal { padding: .85rem; } }

  .exp-cat { margin-bottom: 1rem; }
  .exp-cat h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .cat-header-content {
    padding: 0.55rem 0.7rem;
    background: #eef4fc;
    border: 1px solid #cfe0f5;
    border-left: 4px solid var(--accent);
    border-radius: 8px;
  }
  .cat-header-content h3 {
    margin: 0 !important;
    font-size: 1rem !important;
    font-weight: 800 !important;
    color: var(--accent) !important;
    letter-spacing: 0.01em;
  }
  .cat-edit-input {
    width: 100%;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 0.3rem 0.5rem;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--ink);
  }
  .inline-edit-input {
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 0.35rem 0.5rem;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    flex: 1;
    min-width: 0;
  }
  .cat-add-area { display: flex; justify-content: flex-end; margin-bottom: 0.6rem; }
  .cat-add-icon-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    background: #eef4fc;
    color: var(--accent);
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-add-row { width: 100%; }
  .swipe-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 0.45rem;
  }
  .swipe-actions-bg {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: flex-end;
  }
  .swipe-act {
    width: 74px;
    height: 100%;
    border: none;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .swipe-act.act-edit { background: var(--accent); }
  .swipe-act.act-delete { background: #d1453b; }
  .swipe-content {
    position: relative;
    touch-action: pan-y;
    transition: transform 0.2s ease;
    background: var(--bg);
  }
  .item-cell {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--bg);
  }
  .exp-item.is-actual { border-left: 3px solid var(--paid); background: var(--paid-bg); }
  .exp-item .exp-label { font-size: 0.85rem; flex: 1; min-width: 0; word-break: break-word; }
  .exp-item input[type="number"] {
    width: 90px;
    flex-shrink: 0;
    padding: 0.4rem 0.4rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 0.85rem;
    font-family: inherit;
    color: var(--ink);
  }
  .exp-item input[type="number"]::placeholder { color: #b7bec4; font-size: 0.72rem; }
  .del-btn {
    background: none; border: none; color: #bb4d38; font-size: 1.05rem; cursor: pointer; padding: 0 0.2rem; flex-shrink: 0;
  }
  .add-link {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.4rem 0.1rem;
    margin-top: 0.2rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .add-row { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
  .add-row input { flex: 1; min-width: 0; padding: 0.5rem 0.5rem; border: 1px solid var(--line); border-radius: 6px; font-size: 0.84rem; font-family: inherit; }
  .add-row input.short { flex: 0 0 60px; width: 60px; min-width: 0; }
  .add-row button {
    flex-shrink: 0;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 0.5rem 0.65rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }

  /* Packing */
  .pack-cat { margin-bottom: 1.1rem; }
  .pack-cat h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .pack-item { justify-content: space-between; }
  .p-label {
    appearance: none; -webkit-appearance: none;
    display: block; width: 100%; min-width: 0; flex: 1;
    margin: 0; padding: 0; border: 0; border-radius: 0;
    background: transparent; text-align: left;
    font-family: inherit; font-size: 0.85rem; line-height: 1.35;
    color: var(--ink); word-break: break-word;
    cursor: pointer; touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .p-label:active { opacity: 0.68; }
  .p-label.is-done { color: var(--ink-soft); text-decoration: line-through; }
  .p-label.done-a { text-decoration-color: #0969da; }
  .p-label.done-b { text-decoration-color: #c07a1e; }
  .p-label.done-both { text-decoration-style: double; text-decoration-color: var(--ink-soft); }
  .p-who { display: flex; gap: 5px; flex-shrink: 0; }
  .p-who-dot {
    width: 8px;
    height: 26px;
    border-radius: 4px;
    background: #e4e8eb;
    display: block;
  }
  .p-who-dot.who-a.on { background: #0969da; }
  .p-who-dot.who-b.on { background: #c07a1e; }

  /* Food */
  .food-cat { margin-bottom: 1rem; }
  .food-cat h3 { font-size: 0.95rem; margin-bottom: 0.4rem; }
  .food-label { font-size: 0.85rem; color: var(--ink); flex: 1; min-width: 0; word-break: break-word; }

  /* Bottom nav */
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #fff;
    border-top: 1px solid var(--line);
    display: flex;
    padding: 0.4rem 0.6rem calc(0.4rem + env(safe-area-inset-bottom));
  }
  .nav-btn {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
    background: none; border: none; padding: 0.4rem 0.2rem;
    color: var(--ink-soft); font-family: inherit; font-size: 0.65rem; font-weight: 600;
    cursor: pointer; border-radius: 8px;
  }
  .nav-btn .ic { font-size: 1.15rem; }
  .nav-btn.active { color: var(--accent); background: #eef4fc; }

  /* Who modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 1.2rem;
  }
  .modal-backdrop.show { display: flex; }
  /* Override the generic centered dialog rules for the full-screen budget editor. */
  #budgetModal {
    position: fixed; inset: 0; z-index: 1001; display: none;
    align-items: stretch; justify-content: stretch; padding: 0;
    background: #fff; overscroll-behavior: none; touch-action: pan-y;
  }
  #budgetModal.show { display: flex; }
  #budgetModal > .budget-modal {
    display: flex; flex-direction: column; width: 100%; height: 100vh; height: 100dvh;
    max-width: none; max-height: none; min-height: 0; overflow: hidden; border-radius: 0;
    padding: calc(.75rem + env(safe-area-inset-top)) .9rem calc(.55rem + env(safe-area-inset-bottom));
    color-scheme: light; color: var(--ink); background: #fff;
    overscroll-behavior: contain; touch-action: pan-y;
  }
  #budgetModal #budgetEditor {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
  }

    // Il giorno della partenza resta indicato, ma senza ripetere il nome dell'hotel.
    if (dayId === 'd5' && field === 'M' && /Pension Sonneck/i.test(line)) {
      if (!/Partenza/i.test(line)) continue;
      line = line.replace(/dalla\s+Pension Sonneck(?:\s+a\s+Pfarrwerfen)?/i, '')
        .replace(/Partenza\s*,\s*dopo il check-out/i, 'Partenza dopo il check-out')
        .replace(/\s{2,}/g, ' ').trim();
      if (line) cleaned.push(line);
      continue;
    }
    const hasLodging = allLodgings.test(line);
    const isArrivalLodging = !!(allowedName && allowedName.test(line));
    if (hasLodging && !isArrivalLodging) continue;
    if (/seconda notte al Conlon House|prenotazione confermata|già prenotata/i.test(line) && !isArrivalLodging) continue;
    if (isArrivalLodging) {
      if (arrivalMentionKept) continue;
      arrivalMentionKept = true;
      line = line
        .replace(/\s*\([^)]*(?:prenotat|31\/12|02\/01|Deisenhofener|Neutorstraße|Laubichl|€|notte)[^)]*\)/gi, '')
        .replace(/,?\s*(?:Deisenhofener\s+Str\.?\s*2B|Neutorstraße\s*45|Laubichl\s*14)\.?/gi, '')
        .replace(/\s*[—–-]\s*\d+\s*notti?[^\n]*(?:€[^\n]*)?/gi, '')
        .replace(/\s*\(?\d+(?:[.,]\d{2})?\s*€\)?/g, '')
        .replace(/\s{2,}/g, ' ').trim();
    }
    if (/\b(?:254,34|115,83|104,76)\s*€/i.test(line)) continue;
    if (line) cleaned.push(line);
  }
  return cleaned.join('\n');
}

function syncStatusMsg(msg, isErr) {
  const el = document.getElementById('syncStatus');
  if (el) { el.textContent = msg; el.className = 'sync-status' + (isErr ? ' err' : ''); }
}

function attachSync() {
  if (!firebaseReady) {
    syncStatusMsg('Firebase non disponibile', true);
    return;
  }
  tripDb.ref('diary').on('value', snap => {
    const val = snap.val() || {};
    SEED.days.forEach(d => {
      if (!val[d.id]) return;
      const record = { ...val[d.id] };
      const updates = {};
      ['M', 'P', 'S'].forEach(field => {
        const original = stripEmoji(record[field] || '');
        const cleaned = cleanLodgingDiaryText(d.id, field, original);
        record[field] = cleaned;
        if (cleaned !== (val[d.id][field] || '')) updates[field] = cleaned;
      });
      diaryState[d.id] = record;
      if (Object.keys(updates).length) tripDb.ref('diary/' + d.id).update(updates);
    });
    renderDiary();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  // V3 contiene la lista completa dei prezzi. BudgetV2 rimane archiviato.
  // Il precedente nodo expenses non viene letto né modificato.
  tripDb.ref('budgetV3').on('value', snap => {
    const val = snap.val();
    if (val && Array.isArray(val.items)) {
      budgetItems = val.items.filter(x => x && x.id && x.catId && typeof x.label === 'string' && Number.isFinite(Number(x.amount)))
        .map(x => ({ id: x.id, catId: x.catId, label: stripEmoji(x.label), amount: Number(x.amount) }));
    } else if (val && val.version === 3 && !val.items) {
      // In Firebase una lista vuota può essere serializzata come campo assente.
      budgetItems = [];
    } else {
      // Prima apertura: inizializza il preventivo dettagliato per entrambi.
      budgetItems = BUDGET_SEED.map(x => ({ ...x }));
      const initialBudget = { version: 3, items: BUDGET_SEED.map(x => ({ ...x })) };
      tripDb.ref('budgetV3').transaction(current => current === null ? initialBudget : undefined)
        .catch(err => syncStatusMsg('Impossibile sincronizzare il preventivo: ' + err.message, true));
    }
    renderExpTotals();
    // Non sovrascrivere modifiche ancora non salvate nel popup.
  }, err => syncStatusMsg('Errore di sincronizzazione preventivo: ' + err.message, true));

  tripDb.ref('actualExpenses').on('value', snap => {
    const val = snap.val() || {};
    SEED.expenses = Object.keys(val).map(id => ({ ...val[id], id, label: stripEmoji(val[id].label || '') }))
      .filter(e => e.label && e.catId)
      .sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
    expenseState = Object.fromEntries(SEED.expenses.map(e => [e.id, e]));
    renderExpenses();
  }, err => syncStatusMsg('Errore di sincronizzazione delle spese: ' + err.message, true));

  tripDb.ref('expCats').on('value', snap => {
    const val = snap.val() || {};
    SEED.expCats.forEach(c => { if (val[c.id]) c.name = stripEmoji(val[c.id]); });
    Object.keys(val).forEach(id => {
      if (!SEED.expCats.find(c => c.id === id)) SEED.expCats.push({ id, name: stripEmoji(val[id]) });
    });
    SEED.expCats = SEED.expCats.filter(c => val[c.id] !== undefined || !c.id.includes('_'));
    renderExpenses();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  tripDb.ref('packing').on('value', snap => {
    const val = snap.val() || {};
    SEED.packing.forEach(p => {
      if (val[p.id]) {
        if (val[p.id].A !== undefined || val[p.id].B !== undefined) packState[p.id] = { A: !!val[p.id].A, B: !!val[p.id].B };
        if (val[p.id].label) p.label = stripEmoji(val[p.id].label);
      }
    });
    // remote-added custom items
    Object.keys(val).forEach(id => {
      if (!SEED.packing.find(p => p.id === id) && val[id].label) {
        SEED.packing.push({ id, catId: val[id].catId, label: stripEmoji(val[id].label) });
        packState[id] = { A: !!val[id].A, B: !!val[id].B };
      }
    });
    // remote-deleted custom items (only custom ones, never touch the baseline list)
    SEED.packing = SEED.packing.filter(p => !p.id.startsWith('pcustom_') || val[p.id]);
    renderPacking();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  tripDb.ref('packCats').on('value', snap => {
    const val = snap.val() || {};
    SEED.packCats.forEach(c => { if (val[c.id]) c.name = stripEmoji(val[c.id]); });
    Object.keys(val).forEach(id => {
      if (!SEED.packCats.find(c => c.id === id)) SEED.packCats.push({ id, name: stripEmoji(val[id]) });
    });
    SEED.packCats = SEED.packCats.filter(c => val[c.id] !== undefined || !c.id.includes('_'));
    renderPacking();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  tripDb.ref('food').on('value', snap => {
    const val = snap.val() || {};
    SEED.food.forEach(f => {
      if (val[f.id] && val[f.id].label) {
        foodState[f.id] = { ...val[f.id], label: stripEmoji(val[f.id].label) };
        f.label = stripEmoji(val[f.id].label);
      }
    });
    // remote-added custom items
    Object.keys(val).forEach(id => {
      if (!SEED.food.find(f => f.id === id) && val[id].label) {
        SEED.food.push({ id, catId: val[id].catId, label: stripEmoji(val[id].label) });
        foodState[id] = { ...val[id], label: stripEmoji(val[id].label) };
      }
    });
    // remote-deleted custom items (only custom ones, never touch the baseline list)
    SEED.food = SEED.food.filter(f => !f.id.startsWith('fcustom_') || val[f.id]);
    renderFood();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  tripDb.ref('foodCats').on('value', snap => {
    const val = snap.val() || {};
    SEED.foodCats.forEach(c => { if (val[c.id]) c.name = stripEmoji(val[c.id]); });
    Object.keys(val).forEach(id => {
      if (!SEED.foodCats.find(c => c.id === id)) SEED.foodCats.push({ id, name: stripEmoji(val[id]) });
    });
    SEED.foodCats = SEED.foodCats.filter(c => val[c.id] !== undefined || !c.id.includes('_'));
    renderFood();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  syncStatusMsg('Connesso', false);
}

function debounce(fn, wait) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
}

const editingRows = new Set();
const addFormOpen = new Set();

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function linkify(text, links, used) {
  used = used || new Set();
  let escaped = escapeHtml(text);
  const placeholders = {};
  let counter = 0;
  const sorted = [...links].sort((a, b) => b.label.length - a.label.length);
  sorted.forEach(l => {
    if (used.has(l.label)) return;
    const re = new RegExp('(?<![A-Za-zÀ-ÿ\'])' + escapeRegex(l.label) + '(?![A-Za-zÀ-ÿ])', 'g');
    let matchedOnce = false;
    escaped = escaped.replace(re, (match) => {
      if (matchedOnce) return match;
      matchedOnce = true;
      used.add(l.label);
      const key = '@@LINK' + (counter++) + '@@';
      placeholders[key] = `<a class="place-link" href="${l.url}" target="_blank" rel="noopener">${match}</a>`;
      return key;
    });
  });
  Object.keys(placeholders).forEach(k => { escaped = escaped.split(k).join(placeholders[k]); });
  return escaped;
}

function getDayUsedSetUpTo(dayId, stopField) {
  // Walks the day's content in reading order (M, P, S)
  // and marks place labels as "used" up to (but not including) the given field.
  const d = SEED.days.find(x => x.id === dayId);
  const used = new Set();
  const order = ['M', 'P', 'S'];
  for (const f of order) {
    if (stopField === f) return used;
    linkify(diaryState[dayId][f] || '', d.links, used);
  }
  return used;
}

const ROW_META = {
  M: { word: 'Mattina' },
  P: { word: 'Pomeriggio' },
  S: { word: 'Sera' }
};

function diaryRowHtml(d, field) {

  const [dayId, field] = combinedId.split('__');

function rowContentHtml(d, field) {
  const text = diaryState[d.id][field] || '';
  if (!text) {
    return `<div class="rdisplay"><span class="rempty">scorri a sinistra per scrivere…</span></div>`;
  }
  const used = getDayUsedSetUpTo(d.id, field);
  const lines = text.split('\n').filter(l => l.length > 0);
  const linesHtml = lines.map((line, i) => {
    const linked = linkify(line, d.links, used);
    return i === 0 ? `<div class="rline-main">${linked}</div>` : `<div class="rline-note">${linked}</div>`;
  }).join('');
  return `<div class="rdisplay">${linesHtml}</div>`;
}

let activeDiaryEdit = null;
let diaryEditorScrollY = 0;
let diaryEditorPreviousStyles = null;

function syncDiaryEditorViewport() {
  const modal = document.getElementById('diaryEditorModal');
  if (!modal || !modal.classList.contains('show')) return;
  const vv = window.visualViewport;
  if (vv) {
    modal.style.top = Math.max(0, vv.offsetTop) + 'px';
    modal.style.height = Math.max(0, vv.height) + 'px';
  } else {
    modal.style.top = '0px';
    modal.style.height = window.innerHeight + 'px';
  }
}

function startEdit(dayId, field) {
  const d = SEED.days.find(x => x.id === dayId);
  if (!d || !ROW_META[field]) return;

  activeDiaryEdit = { dayId, field };
  const modal = document.getElementById('diaryEditorModal');
  const title = document.getElementById('diaryEditorTitle');
  const mainTextarea = document.getElementById('diaryEditorMain');
  const notesTextarea = document.getElementById('diaryEditorNotes');
  title.textContent = 'Modifica · ' + ROW_META[field].word;
  const currentLines = stripEmoji(diaryState[dayId][field] || '').split(/\r?\n/).filter(line => line.length > 0);
  mainTextarea.value = currentLines.shift() || '';
  notesTextarea.value = currentLines.join('\n');

  diaryEditorScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  diaryEditorPreviousStyles = {
    bodyPosition: document.body.style.position,
    bodyTop: document.body.style.top,
    bodyLeft: document.body.style.left,
    bodyRight: document.body.style.right,
    bodyWidth: document.body.style.width,
    bodyOverflow: document.body.style.overflow,
    htmlOverflow: document.documentElement.style.overflow
  };
  document.body.classList.add('diary-editor-locked');
  document.documentElement.classList.add('diary-editor-locked');
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + diaryEditorScrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';

/* ---------------------- Spese ---------------------- */
/* ---------------------- Swipe to delete (iOS Mail style) ---------------------- */
function attachSwipeToDelete(container) {
  if (container.dataset.swipeAttached === '1') return;
  container.dataset.swipeAttached = '1';
  const OPEN_THRESHOLD = -40;
  let activeContent = null;
  let activeMax = -84;
  let startX = 0, startY = 0, baseX = 0, dx = 0;
  let dragging = false, gesture = 'idle', moved = false, lastGestureWasSwipe = false;

  container.addEventListener('pointerdown', e => {
    const wrap = e.target.closest('.swipe-wrap');
    if (!wrap || e.target.closest('.swipe-actions-bg')) return;

    container.querySelectorAll('.swipe-content.swiped').forEach(el => {
      const w = el.closest('.swipe-wrap');
      if (w !== wrap) {
        el.style.transform = '';
        el.classList.remove('swiped');
      }
    });

    activeContent = wrap.querySelector('.swipe-content');
    if (!activeContent) return;
    const bg = wrap.querySelector('.swipe-actions-bg');
    activeMax = bg ? -bg.offsetWidth : -84;
    startX = e.clientX;
    startY = e.clientY;
    baseX = activeContent.classList.contains('swiped') ? activeMax : 0;
    dx = baseX;
    dragging = true;
    gesture = 'pending';
    moved = false;
    lastGestureWasSwipe = false;
  });

  container.addEventListener('pointermove', e => {
    if (!dragging || !activeContent) return;
    const deltaX = e.clientX - startX;
    const deltaY = e.clientY - startY;

    if (gesture === 'pending') {
      if (Math.abs(deltaX) < 8 && Math.abs(deltaY) < 8) return;
      // Lascia al browser lo scroll verticale: solo un gesto chiaramente orizzontale apre le azioni.
      if (Math.abs(deltaY) > Math.abs(deltaX) * 1.15) {
        gesture = 'vertical';
        dragging = false;
        activeContent = null;
        return;
      }
      if (Math.abs(deltaX) <= Math.abs(deltaY)) return;
      gesture = 'horizontal';
      activeContent.style.transition = 'none';
    }

    if (gesture !== 'horizontal') return;
    moved = true;
    dx = baseX + deltaX;
    if (dx > 0) dx = 0;
    if (dx < activeMax) dx = activeMax;
    activeContent.style.transform = `translateX(${dx}px)`;
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  function endDrag() {
    if (!dragging || !activeContent) {
      dragging = false;
      activeContent = null;
      return;
    }
    dragging = false;
    if (gesture === 'horizontal') {
      activeContent.style.transition = 'transform 0.2s ease';
      if (dx < OPEN_THRESHOLD) {
        activeContent.style.transform = `translateX(${activeMax}px)`;
        activeContent.classList.add('swiped');
      } else {
        activeContent.style.transform = '';
        activeContent.classList.remove('swiped');
      }
      lastGestureWasSwipe = moved;
    }
    activeContent = null;
    gesture = 'idle';
  }
  container.addEventListener('pointerup', endDrag);
  container.addEventListener('pointercancel', endDrag);

  container.addEventListener('click', e => {
    if (lastGestureWasSwipe) {
      // Il click sintetico che può seguire uno swipe non deve attivare la voce sottostante.
      e.preventDefault();
      e.stopPropagation();
      lastGestureWasSwipe = false;
      return;
    }
    const actBtn = e.target.closest('.swipe-act');
    if (actBtn) {
      const wrap = actBtn.closest('.swipe-wrap');
      const content = wrap.querySelector('.swipe-content');
      if (content) { content.style.transform = ''; content.classList.remove('swiped'); }
      window[actBtn.dataset.fn](actBtn.dataset.id);
      return;
    }
    const openContent = e.target.closest('.swipe-content.swiped');
    if (openContent) {
      // Un tocco su una riga aperta la richiude senza attivare il controllo sottostante.
      e.preventDefault();
      e.stopPropagation();
      openContent.style.transition = 'transform 0.2s ease';
      openContent.style.transform = '';
      openContent.classList.remove('swiped');
    }
  }, true);
}

const ITEMS_KEY = { expCats: 'expenses', packCats: 'packing', foodCats: 'food' };

function catHeaderHtml(cat, listKey) {

    <div class="swipe-wrap cat-header-wrap" id="cathead-${listKey}-${cat.id}">

function startEditCat(combined) {
  const [listKey, catId] = combined.split('|');
  editingRows.add('cat-' + listKey + '-' + catId);
  refreshCatHeader(listKey, catId);
}

function finishEditCat(listKey, catId, value) {
  editingRows.delete('cat-' + listKey + '-' + catId);
  const name = stripEmoji(value);
  if (name) {
    const cat = SEED[listKey].find(c => c.id === catId);
    if (cat) cat.name = name;
    if (firebaseReady) tripDb.ref(listKey + '/' + catId).set(name);
  }
  refreshCatHeader(listKey, catId);
}

function refreshCatHeader(listKey, catId) {
  const cat = SEED[listKey].find(c => c.id === catId);
  const el = document.getElementById('cathead-' + listKey + '-' + catId);
  if (el && cat) el.outerHTML = catHeaderHtml(cat, listKey);
}

function deleteCat(combined) {
  const [listKey, catId] = combined.split('|');
  const itemsArr = ITEMS_KEY[listKey];
  if (listKey === 'expCats' && budgetItems.some(x => x.catId === catId)) {
    alert('Questa categoria contiene voci del preventivo. Per eliminarla, rimuovi prima le sue voci dal popup della stima.');
    return;
  }
  const stateObj = listKey === 'expCats' ? expenseState : listKey === 'packCats' ? packState : foodState;
  const toDelete = SEED[itemsArr].filter(i => i.catId === catId);
  toDelete.forEach(i => {
    const idx = SEED[itemsArr].indexOf(i);
    if (idx > -1) SEED[itemsArr].splice(idx, 1);
    if (firebaseReady) tripDb.ref((listKey === 'expCats' ? 'actualExpenses' : itemsArr) + '/' + i.id).remove();
    delete stateObj[i.id];
  });
  const idx2 = SEED[listKey].findIndex(c => c.id === catId);
  if (idx2 > -1) SEED[listKey].splice(idx2, 1);
  if (firebaseReady) tripDb.ref(listKey + '/' + catId).remove();
  rerenderForList(listKey);
}

function safeId(s) { return s.replace(/[^a-zA-Z0-9]/g, ''); }

function startEditExpLabel(id) {
  editingRows.add('exp-label-' + id);
  refreshExpItem(id);
}

function finishEditExpLabel(id, value) {
  editingRows.delete('exp-label-' + id);
  const label = stripEmoji(value);
  if (label) {
    const e = SEED.expenses.find(x => x.id === id);
    if (e) e.label = label;
    if (!expenseState[id]) expenseState[id] = {};
    expenseState[id].label = label;
    if (firebaseReady) tripDb.ref('actualExpenses/' + id).update({label, updatedAt: Date.now()});
  }
  refreshExpItem(id);
}

function refreshExpItem(id) {
  const el = document.getElementById('exprow-' + id);
  const e = SEED.expenses.find(x => x.id === id);
  if (el && e) el.outerHTML = expItemHtml(e);
}

function escapeAttrValue(s) {
  return stripEmoji(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fmtEuroPlain(n) { return n == null ? '—' : (Number.isInteger(n) ? n : n.toFixed(2)); }
function fmtEuro(n) { return n == null ? '—' : Number(n).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' }); }

function addExpense(catId) {
  const labelEl = document.getElementById('newlabel-' + catId);
  const amtEl = document.getElementById('newamt-' + catId);
  if (!labelEl || !amtEl) return;
  const label = stripEmoji(labelEl.value);
  const value = amtEl.value.trim();
  const amount = Number(value);
  if (!label || value === '' || !Number.isFinite(amount) || amount < 0) {
    alert('Inserisci una descrizione e un importo valido.');
    return;
  }
  const id = 'custom_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  const item = { id, catId, label, amount: Math.round(amount * 100) / 100, createdAt: Date.now() };
  SEED.expenses.push(item);
  saveExpenseNew(item);
  addFormOpen.delete('exp-' + catId);
  renderExpenses();
}

// Il riepilogo usa due insiemi separati: budget previsto e registrazioni effettive.
function renderExpTotals() {
  const estimate = Math.round(budgetItems.reduce((sum, e) => sum + (Number(e.amount) || 0), 0) * 100) / 100;
  const spent = Math.round(SEED.expenses.reduce((sum, e) => sum + (e.amount == null ? 0 : Number(e.amount) || 0), 0) * 100) / 100;
  const remaining = Math.round((estimate - spent) * 100) / 100;
  document.getElementById('expEstTotal').textContent = fmtEuro(estimate);
  document.getElementById('expActualTotal').textContent = fmtEuro(spent);
  const remEl = document.getElementById('expRemaining');
  remEl.textContent = fmtEuro(remaining);
  remEl.classList.toggle('negative', remaining < 0);
  const warningEl = document.getElementById('expPending');
  warningEl.hidden = remaining >= 0;
  warningEl.textContent = remaining < 0 ? 'Budget superato di ' + fmtEuro(Math.abs(remaining)) : '';
}

let budgetModalScrollY = 0;
let budgetModalPreviousStyles = null;

function syncBudgetModalViewport() {
  const modal = document.getElementById('budgetModal');
  if (!modal || !modal.classList.contains('show')) return;
  const vv = window.visualViewport;
  if (vv) {
    modal.style.top = Math.max(0, vv.offsetTop) + 'px';
    modal.style.height = Math.max(0, vv.height) + 'px';
  } else {
    modal.style.top = '0px';
    modal.style.height = window.innerHeight + 'px';
  }
}

function openBudgetModal() {
  budgetDraft = budgetItems.map(x => ({ ...x }));
  renderBudgetEditor();
  budgetModalScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  budgetModalPreviousStyles = {
    bodyPosition: document.body.style.position,
    bodyTop: document.body.style.top,
    bodyLeft: document.body.style.left,
    bodyRight: document.body.style.right,
    bodyWidth: document.body.style.width,
    bodyOverflow: document.body.style.overflow,
    htmlOverflow: document.documentElement.style.overflow
  };
  document.body.classList.add('budget-modal-locked');
  document.documentElement.classList.add('budget-modal-locked');
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + budgetModalScrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';
  const modal = document.getElementById('budgetModal');
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  syncBudgetModalViewport();
  requestAnimationFrame(syncBudgetModalViewport);
}

function closeBudgetModal() {
  const modal = document.getElementById('budgetModal');
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  modal.style.top = '';
  modal.style.height = '';
  if (budgetModalPreviousStyles) {
    document.body.style.position = budgetModalPreviousStyles.bodyPosition;
    document.body.style.top = budgetModalPreviousStyles.bodyTop;
    document.body.style.left = budgetModalPreviousStyles.bodyLeft;
    document.body.style.right = budgetModalPreviousStyles.bodyRight;
    document.body.style.width = budgetModalPreviousStyles.bodyWidth;
    document.body.style.overflow = budgetModalPreviousStyles.bodyOverflow;
    document.documentElement.style.overflow = budgetModalPreviousStyles.htmlOverflow;
  }
  document.body.classList.remove('budget-modal-locked');
  document.documentElement.classList.remove('budget-modal-locked');
  budgetModalPreviousStyles = null;
  budgetDraft = null; // Annulla le modifiche non salvate.
  window.scrollTo(0, budgetModalScrollY);
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncBudgetModalViewport);
  window.visualViewport.addEventListener('scroll', syncBudgetModalViewport);
}

function renderBudgetEditor() {
  if (!budgetDraft) return;
  document.getElementById('budgetEditor').innerHTML = SEED.expCats.map(cat => {
    const items = budgetDraft.filter(x => x.catId === cat.id);
    const subtotal = items.reduce((sum,x) => sum + (Number(x.amount)||0), 0);
    return `<div class="budget-cat">
      <div class="budget-cat-head"><span>${escapeAttrValue(cat.name)}</span><span data-budget-subtotal="${cat.id}">${fmtEuro(Math.round(subtotal * 100)/100)}</span></div>
      ${items.map(e => `<div class="budget-line">
        <input type="text" aria-label="Descrizione previsione" value="${escapeAttrValue(e.label)}" oninput="updateBudgetLabel('${e.id}',this.value)">
        <input type="number" aria-label="Importo stimato in euro" min="0" step="0.01" value="${e.amount}" oninput="updateBudgetAmount('${e.id}',this.value)">
        <button type="button" class="budget-remove" aria-label="Rimuovi voce" onclick="removeBudgetItem('${e.id}')">×</button>
      </div>`).join('')}
      <button type="button" class="budget-add" onclick="addBudgetItem('${cat.id}')">+ Aggiungi voce al preventivo</button>
    </div>`;
  }).join('');
  updateBudgetModalTotal();
}

function updateBudgetLabel(id, value) {
  if (!budgetDraft) return;
  const item = budgetDraft.find(x => x.id === id);
  if (item) item.label = stripEmoji(value);
}

function updateBudgetAmount(id, value) {
  if (!budgetDraft) return;
  const item = budgetDraft.find(x => x.id === id);
  if (item) item.amount = value === '' ? 0 : Number(value);
  updateBudgetModalTotal();
}

function updateBudgetModalTotal() {
  if (!budgetDraft) return;
  let sum = 0;
  SEED.expCats.forEach(cat => {
    const sub = budgetDraft.filter(x => x.catId === cat.id).reduce((s,x) => s + (Number(x.amount) || 0), 0);
    sum += sub;
    const el = document.querySelector(`[data-budget-subtotal="${cat.id}"]`);
    if (el) el.textContent = fmtEuro(Math.round(sub * 100) / 100);
  });
  document.getElementById('budgetEditorTotal').textContent = fmtEuro(Math.round(sum * 100) / 100);
}

function addBudgetItem(catId) {
  if (!budgetDraft) return;
  const id = 'budget_custom_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  budgetDraft.push({ id, catId, label: '', amount: 0 });
  renderBudgetEditor();
  const inputs = document.querySelectorAll('#budgetEditor .budget-line input[type="text"]');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

function removeBudgetItem(id) {
  if (!budgetDraft) return;
  budgetDraft = budgetDraft.filter(x => x.id !== id);
  renderBudgetEditor();
}

function saveBudget() {
  if (!budgetDraft) return;
  for (const item of budgetDraft) {
    if (!item.label.trim() || !Number.isFinite(Number(item.amount)) || Number(item.amount) < 0) {
      alert('Completa le descrizioni e inserisci importi validi (almeno 0 €).');
      return;
    }
  }
  budgetItems = budgetDraft.map(item => ({ id: item.id, catId: item.catId,
    label: stripEmoji(item.label), amount: Math.round(Number(item.amount) * 100) / 100 }));
  if (firebaseReady) {
    tripDb.ref('budgetV3').set({ version: 3, items: budgetItems, updatedAt: Date.now() })
      .catch(err => alert('Il preventivo non è stato sincronizzato: ' + err.message));
  } else {
    alert('Firebase non è disponibile: il preventivo modificato è visibile solo finché questa pagina resta aperta.');
  }
  closeBudgetModal();
  renderExpTotals();
}

  return `
    <div class="swipe-wrap" id="packrow-${p.id}">
      <div class="swipe-actions-bg">
        <button class="swipe-act act-edit" data-fn="startEditPackLabel" data-id="${p.id}">Modifica</button>
        <button class="swipe-act act-delete" data-fn="deletePackItem" data-id="${p.id}">Elimina</button>
      </div>
      <div class="swipe-content item-cell pack-item">
        ${labelHtml}
        <div class="p-who">
          <span class="p-who-dot who-a ${st.A ? 'on' : ''}" title="${PERSON_A}"></span>
          <span class="p-who-dot who-b ${st.B ? 'on' : ''}" title="${PERSON_B}"></span>
        </div>
      </div>
    </div>
  `;
}

function startEditPackLabel(id) {
  editingRows.add('pack-label-' + id);
  renderPackingItem(id);
}

function finishEditPackLabel(id, value) {
  editingRows.delete('pack-label-' + id);
  const label = stripEmoji(value);
  if (label) {
    const p = SEED.packing.find(x => x.id === id);
    if (p) p.label = label;
    if (!packState[id]) packState[id] = { A: false, B: false };
    const payload = { A: !!packState[id].A, B: !!packState[id].B, label, catId: p ? p.catId : undefined };
    if (firebaseReady) tripDb.ref('packing/' + id).set(payload);
  }
  renderPackingItem(id);
}

function addPackItem(catId) {
  const input = document.getElementById('newpack-' + catId);
  const label = stripEmoji(input.value);
  if (!label) return;
  const id = 'pcustom_' + Date.now();
  const item = { id, catId, label };
  SEED.packing.push(item);
  packState[id] = { A: false, B: false };
  if (firebaseReady) tripDb.ref('packing/' + id).set(Object.assign({ label, catId }, packState[id]));
  addFormOpen.delete('pack-' + catId);
  renderPacking();
}

function deletePackItem(id) {
  const idx = SEED.packing.findIndex(p => p.id === id);
  if (idx > -1) SEED.packing.splice(idx, 1);
  delete packState[id];
  if (firebaseReady) tripDb.ref('packing/' + id).remove();
  renderPacking();
}

function updatePackItemUI(id) {
  const row = document.getElementById('packrow-' + id);
  if (!row) return;
  const state = packState[id] || { A: false, B: false };
  const label = row.querySelector('.p-label');
  if (label) {
    const isDoneForMe = me ? !!state[me] : false;
    label.classList.toggle('is-done', isDoneForMe);
    label.classList.toggle('done-a', isDoneForMe && me === 'A');
    label.classList.toggle('done-b', isDoneForMe && me === 'B');
    label.setAttribute('aria-pressed', String(isDoneForMe));
  }
  const dotA = row.querySelector('.p-who-dot.who-a');
  const dotB = row.querySelector('.p-who-dot.who-b');
  if (dotA) dotA.classList.toggle('on', !!state.A);
  if (dotB) dotB.classList.toggle('on', !!state.B);
}

function renderPackingItem(id) {
  const el = document.getElementById('packrow-' + id);
  if (!el) return;
  const p = SEED.packing.find(x => x.id === id);
  if (!p) return;
  el.outerHTML = packItemHtml(p);
}

/* ---------------------- Da assaggiare ---------------------- */
function renderFood() {
  const c = document.getElementById('foodCategories');
  c.innerHTML = SEED.foodCats.map(cat => {
    const items = SEED.food.filter(f => f.catId === cat.id);
    return `<div class="food-cat">${catHeaderHtml(cat, 'foodCats')}${items.map(f => foodItemHtml(f)).join('')}
      ${foodAddRowHtml(cat.id)}
    </div>`;
  }).join('');
  document.getElementById('foodCatAddArea').innerHTML = catAddAreaHtml('foodCats');
  attachSwipeToDelete(c);
}

function foodAddRowHtml(catId) {
  const key = 'food-' + catId;
  if (!addFormOpen.has(key)) {
    return `<button class="add-link" onclick="openFoodAdd('${catId}')">+ Aggiungi</button>`;
  }
  return `
    <div class="add-row">
      <input type="text" placeholder="Nuovo piatto/luogo…" id="newfood-${catId}"
        onkeydown="if(event.key==='Enter'){addFoodItem('${catId}');}">
      <button onclick="addFoodItem('${catId}')">+</button>
    </div>
  `;
}

function openFoodAdd(catId) {
  addFormOpen.add('food-' + catId);
  renderFood();
  setTimeout(() => {
    const el = document.getElementById('newfood-' + catId);
    if (el) el.focus();
  }, 60);
}

function foodItemHtml(f) {
  const key = 'food-' + f.id;
  const label = (foodState[f.id] || {}).label ?? f.label;
  const inner = editingRows.has(key)
    ? `<input type="text" class="inline-edit-input" autofocus value="${escapeAttrValue(label)}"
        onblur="finishEditFood('${f.id}', this.value)"
        onkeydown="if(event.key==='Enter'){this.blur();}">`
    : `<span class="food-label">${escapeHtml(label)}</span>`;
  return `
    <div class="swipe-wrap" id="foodrow-${f.id}">
      <div class="swipe-actions-bg">
        <button class="swipe-act act-edit" data-fn="startEditFood" data-id="${f.id}">Modifica</button>
        <button class="swipe-act act-delete" data-fn="deleteFoodItem" data-id="${f.id}">Elimina</button>
      </div>
      <div class="swipe-content item-cell food-item">${inner}</div>
    </div>
  `;
}

function startEditFood(id) {
  editingRows.add('food-' + id);
  refreshFoodItem(id);
}

function finishEditFood(id, value) {
  editingRows.delete('food-' + id);
  const label = stripEmoji(value);
  if (label) {
    foodState[id] = { label };
    const f = SEED.food.find(x => x.id === id);
    if (f) f.label = label;
    if (firebaseReady) tripDb.ref('food/' + id).set({ label, catId: f ? f.catId : undefined });
  }
  refreshFoodItem(id);
}

function refreshFoodItem(id) {
  const el = document.getElementById('foodrow-' + id);
  const f = SEED.food.find(x => x.id === id);
  if (el && f) el.outerHTML = foodItemHtml(f);
}

function addFoodItem(catId) {
  const input = document.getElementById('newfood-' + catId);
  const label = stripEmoji(input.value);
  if (!label) return;
  const id = 'fcustom_' + Date.now();
  const item = { id, catId, label };
  SEED.food.push(item);
  foodState[id] = { label };
  if (firebaseReady) tripDb.ref('food/' + id).set({ label, catId });
  addFormOpen.delete('food-' + catId);
  renderFood();
}

function deleteFoodItem(id) {
  const idx = SEED.food.findIndex(f => f.id === id);
  if (idx > -1) SEED.food.splice(idx, 1);
  delete foodState[id];
  if (firebaseReady) tripDb.ref('food/' + id).remove();
  renderFood();
}

/* ---------------------- Navigation ---------------------- */
const NO_TOPBAR_VIEWS = ['spese', 'portare', 'assaggiare'];
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    document.getElementById('topbar').style.display = NO_TOPBAR_VIEWS.includes(btn.dataset.view) ? 'none' : 'flex';
  });
});

/* ---------------------- Who am I ---------------------- */
const whoModal = document.getElementById('whoModal');
const whoBtn = document.getElementById('whoBtn');
const whoLabelEl = document.getElementById('whoLabel');
const whoDotEl = document.getElementById('whoDot');
const PERSON_COLORS = { A: '#0969da', B: '#c07a1e' };

function setWho(p) {
  me = p;
  localStorage.setItem('capodanno2027_who', p);
  whoLabelEl.textContent = p === 'A' ? PERSON_A : PERSON_B;
  whoDotEl.style.background = PERSON_COLORS[p];
  whoModal.classList.remove('show');
  if (document.getElementById('packCategories')) SEED.packing.forEach(item => updatePackItemUI(item.id));
}

document.querySelectorAll('.who-pick').forEach(b => b.addEventListener('click', () => setWho(b.dataset.person)));
whoBtn.addEventListener('click', () => whoModal.classList.add('show'));

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && activeDiaryEdit) cancelDiaryEdit();
});

if (me) { setWho(me); }
else { whoModal.classList.add('show'); }

renderCalendar();
renderDiary();
renderExpenses();
renderPacking();
renderFood();
attachSync();


</script>
</body>
</html>
