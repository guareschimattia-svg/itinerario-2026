<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Vacanza 2026 — Diario condiviso</title>
<style>
  :root {
    --ink: #24292e;
    --ink-soft: #57606a;
    --line: #d0d7de;
    --bg: #ffffff;
    --accent: #0969da;
    --paid: #2e7d46;
    --paid-bg: #eaf5ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f6f8fa;
    color: var(--ink);
    padding-bottom: 84px;
  }
  h1, h2, h3 { margin: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 15;
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 0.85rem 1rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 1.1rem; font-weight: 700; }
  .who-btn {
    background: #f6f8fa;
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 0.4rem 0.7rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  main { max-width: 720px; margin: 0 auto; padding: 1rem; }
  .view { display: none; }
  .view.active { display: block; }

  /* Diary */
  .calendar-wrap {
    position: sticky;
    top: 57px;
    background: #f6f8fa;
    padding: 0.7rem 0 0.6rem;
    margin-bottom: 0.8rem;
    z-index: 9;
    border-bottom: 1px solid var(--line);
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-wd { font-size: 0.72rem; color: var(--ink-soft); text-align: center; font-weight: 700; padding-bottom: 4px; }
  .cal-cell {
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; color: #c8ccd1;
    border-radius: 50%;
    text-decoration: none;
  }
  .cal-active {
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    font-weight: 700;
    cursor: pointer;
  }
  .cal-active.current {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 2px 6px rgba(9,105,218,0.35);
    transform: scale(1.08);
  }
  .day-card {
    background: var(--bg);
    border-radius: 10px;
    margin-bottom: 1rem;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .day-head-static {
    padding: 0.6rem 0.5rem;
    background: #f6f8fa;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 0.4rem;
  }
  .day-head-mid { flex: 1; text-align: center; min-width: 0; cursor: pointer; }
  .day-head-mid .dtitle { font-weight: 700; font-size: 0.92rem; }
  .day-head-mid .dnum { font-size: 0.68rem; color: var(--accent); font-weight: 600; margin-bottom: 0.1rem; }
  .day-nav-btn {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .day-nav-btn:disabled { color: var(--line); cursor: default; }
  .day-nav-btn:active:not(:disabled) { background: #eef4fc; }
  .day-body { padding: 0.8rem 1rem 1rem; }
  .maps-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.8rem; }
  .maps-chip {
    font-size: 0.74rem;
    color: var(--accent);
    background: #eef4fc;
    border: 1px solid #cfe0f5;
    border-radius: 20px;
    padding: 0.28rem 0.6rem;
    text-decoration: none;
  }
  .maps-chip:before { content: "📍"; font-size: 0.7rem; margin-right: 0.2rem; }
  .dayrow { display: flex; gap: 0.6rem; margin-bottom: 0.6rem; align-items: flex-start; }
  .dayrow .rlabel {
    flex: 0 0 24px;
    height: 26px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin-top: 4px;
  }
  .rowcontent { flex: 1; min-width: 0; }
  .dayrow textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
    font-family: inherit;
    font-size: 0.88rem;
    line-height: 1.45;
    color: var(--ink);
    background: #fff;
    resize: vertical;
    min-height: 46px;
  }
  .dayrow textarea:focus { outline: none; border-color: var(--accent); }
  .rdisplay {
    flex: 1;
    padding: 0.5rem 0.6rem;
    line-height: 1.45;
    color: var(--ink);
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: text;
  }
  .rdisplay:hover { background: #f6f8fa; border-color: var(--line); }
  .rdisplay .rempty { color: var(--ink-soft); font-style: italic; font-size: 0.88rem; }
  .rline-main { font-size: 0.88rem; color: var(--ink); }
  .rline-note {
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-top: 0.3rem;
    padding-top: 0.3rem;
    border-top: 1px dotted var(--line);
  }
  .rdisplay .place-link {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: rgba(9,105,218,0.4);
    text-underline-offset: 2px;
  }
  .diary-meta { font-size: 0.7rem; color: var(--ink-soft); margin-top: 0.5rem; min-height: 1em; }

  /* Expenses */
  .exp-hero {
    background: var(--bg);
    border-radius: 10px;
    border: 1px solid var(--line);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .exp-hero-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0.35rem 0; }
  .exp-hero-row .lbl { font-size: 0.85rem; color: var(--ink-soft); }
  .exp-hero-row .val { font-weight: 700; font-size: 1.1rem; }
  .exp-hero-row.grand { border-top: 2px solid var(--ink); margin-top: 0.4rem; padding-top: 0.6rem; }
  .exp-hero-row.grand .val { font-size: 1.4rem; color: var(--accent); }
  .exp-cat { margin-bottom: 1rem; }
  .exp-cat h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .exp-item {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.55rem 0.65rem;
    margin-bottom: 0.45rem;
    display: flex; align-items: center; gap: 0.6rem;
  }
  .exp-item.is-actual { border-left: 3px solid var(--paid); background: var(--paid-bg); }
  .exp-item .exp-label { font-size: 0.85rem; flex: 1; min-width: 0; word-break: break-word; }
  .exp-item input[type="number"] {
    width: 90px;
    flex-shrink: 0;
    padding: 0.4rem 0.4rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 0.85rem;
    font-family: inherit;
    color: var(--ink);
  }
  .exp-item input[type="number"]::placeholder { color: #b7bec4; font-size: 0.72rem; }
  .del-btn {
    background: none; border: none; color: #bb4d38; font-size: 1.05rem; cursor: pointer; padding: 0 0.2rem; flex-shrink: 0;
  }
  .add-row { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
  .add-row input { flex: 1; min-width: 0; padding: 0.5rem 0.5rem; border: 1px solid var(--line); border-radius: 6px; font-size: 0.84rem; font-family: inherit; }
  .add-row input.short { flex: 0 0 60px; width: 60px; min-width: 0; }
  .add-row button {
    flex-shrink: 0;
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 0.5rem 0.65rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }

  /* Packing */
  .pack-cat { margin-bottom: 1.1rem; }
  .pack-cat h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .pack-item {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
    margin-bottom: 0.4rem;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .pack-item-label {
    flex: 1;
    min-width: 0;
    display: flex; align-items: center; gap: 0.6rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .pack-item:active { background: #f6f8fa; }
  .p-checkbox { width: 19px; height: 19px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .p-label { font-size: 0.85rem; color: var(--ink); }
  .p-label.is-done { text-decoration: line-through; color: var(--ink-soft); }

  /* Food */
  .food-cat { margin-bottom: 1rem; }
  .food-cat h3 { font-size: 0.95rem; margin-bottom: 0.4rem; }
  .food-cat ul { list-style: none; padding: 0; margin: 0; }
  .food-cat li { font-size: 0.85rem; padding: 0.4rem 0; border-bottom: 1px solid var(--line); }

  /* Bottom nav */
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #fff;
    border-top: 1px solid var(--line);
    display: flex;
    padding: 0.4rem 0.6rem calc(0.4rem + env(safe-area-inset-bottom));
  }
  .nav-btn {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
    background: none; border: none; padding: 0.4rem 0.2rem;
    color: var(--ink-soft); font-family: inherit; font-size: 0.65rem; font-weight: 600;
    cursor: pointer; border-radius: 8px;
  }
  .nav-btn .ic { font-size: 1.15rem; }
  .nav-btn.active { color: var(--accent); background: #eef4fc; }

  /* Who modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 1.2rem;
  }
  .modal-backdrop.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 1.3rem; max-width: 300px; width: 100%; }
  .modal h2 { font-size: 1.05rem; margin-bottom: 0.9rem; }
  .modal button.who-pick {
    display: block; width: 100%; padding: 0.7rem; margin-bottom: 0.5rem;
    border: 2px solid var(--line); background: #fff; border-radius: 8px;
    font-family: inherit; font-size: 0.92rem; font-weight: 600; color: var(--ink);
    cursor: pointer;
  }
  .sync-status { font-size: 0.68rem; text-align: center; color: var(--ink-soft); padding: 0.4rem 0 0; }
  .sync-status.err { color: #bb4d38; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🌊 Vacanza 2026</h1>
  <button class="who-btn" id="whoBtn">Chi sei?</button>
</div>

<main>
  <section id="view-diario" class="view active">
    <div id="calendarGrid" class="calendar-wrap"></div>
    <div id="daysContainer"></div>
  </section>

  <section id="view-spese" class="view">
    <div class="exp-hero">
      <div class="exp-hero-row"><span class="lbl">Stima totale</span><span class="val" id="expEstTotal">—</span></div>
      <div class="exp-hero-row"><span class="lbl">Speso finora (importi confermati)</span><span class="val" id="expActualTotal">—</span></div>
      <div class="exp-hero-row grand"><span class="lbl">Rimane da spendere</span><span class="val" id="expRemaining">—</span></div>
    </div>
    <div id="expCategories"></div>
  </section>

  <section id="view-portare" class="view">
    <div id="packCategories"></div>
  </section>

  <section id="view-assaggiare" class="view">
    <div id="foodCategories"></div>
  </section>
</main>

<nav class="bottom-bar">
  <button class="nav-btn active" data-view="diario"><span class="ic">📅</span>Itinerario</button>
  <button class="nav-btn" data-view="spese"><span class="ic">💶</span>Spese</button>
  <button class="nav-btn" data-view="portare"><span class="ic">🎒</span>Da portare</button>
  <button class="nav-btn" data-view="assaggiare"><span class="ic">🍋</span>Da assaggiare</button>
</nav>

<div class="modal-backdrop" id="whoModal">
  <div class="modal">
    <h2>Chi sei?</h2>
    <button class="who-pick" data-person="A">Mattia</button>
    <button class="who-pick" data-person="B">Adriana</button>
    <div class="sync-status" id="syncStatus">Connessione al database…</div>
  </div>
</div>

irceo"}], "M": "spiaggia, mare con calma.", "P": "trekking sul Monte Circeo fino alla cima — sentiero impegnativo ma con vista straordinaria su tutto il promontorio, le isole Ponziane e la costa.\n🥪 Panino/pranzo al sacco durante il trekking.", "S": "spesa a San Felice Circeo prima che chiudano i negozi, rientro al campeggio.\n🐟 Grigliata di pesce al campeggio."}, {"id": "d4", "title": "Sabaudia (Mar 1 settembre)", "links": [{"label": "Sabaudia", "url": "https://maps.apple.com/?ll=41.3009,13.0269&q=Sabaudia"}, {"label": "Terracina", "url": "https://maps.apple.com/?ll=41.2926,13.2496&q=Terracina"}], "M": "giornata a Terracina (~40 min da Sabaudia) — Tempio di Giove Anxur, le rovine romane su uno sperone roccioso con vista mozzafiato sul golfo.\n🥪 Pranzo semplice (panino) a Terracina.", "P": "Spiaggia di Levante, ai piedi del promontorio del tempio — sabbia dorata finissima, acqua bassa, Bandiera Blu.", "S": "ultima serata a Sabaudia.\n🐟 Il ristorante di pesce sul lungomare che conoscete già."}, {"id": "d5", "title": "Sabaudia → Baia → Ischia (Mer 2 settembre)", "links": [{"label": "Sabaudia", "url": "https://maps.apple.com/?ll=41.3009,13.0269&q=Sabaudia"}, {"label": "Baia", "url": "https://maps.apple.com/?ll=40.8236,14.1219&q=Baia%20/%20Pozzuoli"}, {"label": "Pozzuoli", "url": "https://maps.apple.com/?ll=40.8236,14.1219&q=Baia%20/%20Pozzuoli"}, {"label": "Barano", "url": "https://maps.apple.com/?ll=40.7213,13.9114&q=Barano%20d%27Ischia"}, {"label": "Piscina Mirabile", "url": "https://maps.apple.com/?ll=40.7908,14.0842&q=Piscina%20Mirabile"}], "M": "checkout dal campeggio, trasferimento da Sabaudia verso Baia (~2h), in tempo per l'immersione/snorkeling guidata dalle 12:00 alle 14:30 nel Parco Archeologico Sommerso di Baia.", "P": "Piscina Mirabile a Bacoli — la più grande cisterna romana d'epoca imperiale, la \"Cattedrale dell'Acqua\" (visita guidata di 45 min); se le Cento Camerelle sono riaperte, sono a 400m e si vedono con lo stesso biglietto cumulativo. Poi tempo libero prima dell'imbarco.\n🥪 Pranzo semplice (panino) in zona Pozzuoli.", "S": "traghetto Pozzuoli → Ischia delle 19:00, arrivo alle 20:05, check-in e sistemazione.\n🍕 Pizza da Rosa dei Venti a Barano — gourmet, ingredienti locali, comoda per la prima sera."}, {"id": "d6", "title": "Ischia (Gio 3 settembre)", "links": [{"label": "Barano", "url": "https://maps.apple.com/?ll=40.7213,13.9114&q=Barano%20d%27Ischia"}, {"label": "Maronti", "url": "https://maps.apple.com/?ll=40.6980,13.8990&q=Maronti%20/%20Sant%27Angelo"}, {"label": "Sant'Angelo", "url": "https://maps.apple.com/?ll=40.6980,13.8990&q=Maronti%20/%20Sant%27Angelo"}], "M": "spesa con piccola visita a Barano/Testaccio.\n🥐 Colazione in un bar del paese.", "P": "mare alla spiaggia dei Maronti (auto dalla strada panoramica da Testaccio, parcheggi custoditi nei dintorni).\n🍷 Aperitivo con vista in uno dei locali di Sant'Angelo.\nDentro la stessa baia, zona Cavascura: le Fumarole, sabbia calda naturale per l'effetto termale — se volete, ci si arriva a piedi lungo la spiaggia.", "S": "Monte Epomeo al tramonto — si parte da Fontana (Barano, comodo da casa), salita di circa 1h e discesa di 40-50 min, vista a 360° sull'isola; in alternativa, la solita passeggiata nel borgo di Sant'Angelo.\n🔥 Cena a casa con grigliata."}, {"id": "d7", "title": "Ischia (Ven 4 settembre)", "links": [{"label": "Giardini Poseidon", "url": "https://maps.apple.com/?ll=40.7080,13.8590&q=Giardini%20Poseidon"}, {"label": "Forio", "url": "https://maps.apple.com/?ll=40.7386,13.8583&q=Forio"}], "M": "Giardini Poseidon o Negombo, giornata intera (apertura 9:00).\n🥐 Colazione da Divino Cafè (Forio) — ottimi cornetti, babà e cannoli, prima di entrare alle terme.", "P": "ancora Giardini Poseidon (accesso incluso anche alla spiaggia di Citara, sotto il parco), fino alla chiusura alle 19:00.", "S": "relax serale a Forio, passeggiata sul lungomare.\n🍷 Aperitivo tardo a Forio."}, {"id": "d8", "title": "Ischia → Procida → Ischia (Sab 5 settembre)", "links": [{"label": "Procida", "url": "https://maps.apple.com/?ll=40.7597,14.0206&q=Procida"}], "M": "traghetto da Ischia a Procida, arrivo a Marina Grande. Passeggiata veloce nella zona del porto — Via Roma, le casette colorate, Chiesa della Madonna della Pietà. Bus verso Chiaiolella: passeggiata sul lungomare verso Ciraccio, con vista su Vivara e i faraglioni (Vivara si guarda da qui, non serve visitarla a parte). Bus di rientro verso Terra Murata: Piazza dei Martiri, Santuario di Santa Maria delle Grazie, Belvedere dei Cannoni (vista sulla Corricella), Abbazia di San Michele.\n🥐 Caffè con lingua di bue (il dolce tipico di Procida) al Bar Pasticceria Roma (Via Roma 164) — il locale originale dove è stata inventata negli anni '50, considerato il migliore dell'isola.\nPalazzo d'Avalos (ex carcere borbonico), a Terra Murata: probabilmente la visita culturale più interessante dell'isola (~1 ora), ma solo se prenotata in anticipo — altrimenti si salta senza problemi e si prosegue verso la Corricella.", "P": "discesa a piedi da Terra Murata verso Marina Corricella (uno dei tratti più belli dell'isola: case color pastello, scalinate, scorci sul mare), pranzo in uno dei ristoranti sul porticciolo. Poi salita e discesa verso la Spiaggia della Chiaia (la famosa scalinata di 186 gradini), bagno e relax.\n🐟 Pranzo alla Corricella — pasta al limone di Procida, pesce fresco/alici/paranza fritta, granita al limone.", "S": "risalita verso Marina Grande, tempo libero sul porto di Procida prima dell'imbarco, traghetto di rientro a Ischia, poi tramonto sulla Spiaggia dei Pescatori con il Castello Aragonese sullo sfondo (la visita completa è il 9 settembre, con più calma)."}, {"id": "d9", "title": "Ischia (Dom 6 settembre)", "links": [{"label": "Giardino La Mortella", "url": "https://maps.apple.com/?ll=40.7370,13.8600&q=Giardino%20La%20Mortella"}, {"label": "Forio", "url": "https://maps.apple.com/?ll=40.7386,13.8583&q=Forio"}, {"label": "San Montano", "url": "https://maps.apple.com/?ll=40.7550,13.8870&q=San%20Montano"}], "M": "Giardino La Mortella a Forio (aperto la domenica, 9:00-19:00 — prevedere 2-3 ore), poi trasferimento verso la Baia di San Montano — c'è un parcheggio vicino alla baia, ma in alta stagione conviene arrivare presto per trovare posto.\n🥐 Colazione in un bar a Forio, prima di entrare a La Mortella.\nSulla strada verso San Montano: il Fungo di Lacco Ameno, la celebre roccia vulcanica a forma di fungo sul lungomare — bastano 5-10 minuti per una foto.", "P": "mare con calma a San Montano, snorkeling libero.", "S": "relax serale, rientro verso Forio per cena.\n🍕 Pizza da Zi Carmela a Forio — storica, vicino al porticciolo."}, {"id": "d10", "title": "Ischia → Capri → Ischia (Lun 7 settembre)", "links": [{"label": "Capri", "url": "https://maps.apple.com/?ll=40.5532,14.2429&q=Capri"}, {"label": "Marina Grande", "url": "https://maps.apple.com/?ll=40.5532,14.2429&q=Capri"}, {"label": "Anacapri", "url": "https://maps.apple.com/?ll=40.5532,14.2429&q=Capri"}, {"label": "Chiesa di San Michele", "url": "https://maps.apple.com/?ll=40.5546,14.2260&q=Chiesa%20di%20San%20Michele"}, {"label": "Monte Solaro", "url": "https://maps.apple.com/?ll=40.5490,14.2130&q=Monte%20Solaro"}, {"label": "Piazza Vittoria", "url": "https://maps.apple.com/?ll=40.5545,14.2255&q=Piazza%20Vittoria"}, {"label": "Casa Rossa", "url": "https://maps.apple.com/?ll=40.5580,14.2280&q=Casa%20Rossa"}, {"label": "Certosa di San Giacomo", "url": "https://maps.apple.com/?ll=40.5497,14.2445&q=Certosa%20di%20San%20Giacomo"}, {"label": "Belvedere di Tragara", "url": "https://maps.apple.com/?ll=40.5460,14.2470&q=Belvedere%20di%20Tragara"}, {"label": "Arco Naturale", "url": "https://maps.apple.com/?ll=40.5461,14.2586&q=Arco%20Naturale"}], "M": "traghetto da Ischia Porto, arrivo a Marina Grande. Bus verso Anacapri, giro veloce del centro. Poi bus da Anacapri verso Capri centro.\n🥐 Cornetto da Bar Calise a Ischia Porto, prima di imbarcarvi (storico dal 1925, il bar simbolo di Ischia).\nAd Anacapri, se resta tempo: Villa San Michele (giardini e vista sul golfo) Chiesa di San Michele (pavimento in maiolica dipinta) Monte Solaro in seggiovia Piazza Vittoria e Via Giuseppe Orlandi Casa Rossa", "P": "Giardini di Augusto (vista su Via Krupp e sui Faraglioni), poi discesa panoramica per Via Krupp fino alla Scogliera dell'Arsenale/Marina Piccola (verificare che sia aperta) — bagno e pranzo con calma. Al passaggio in centro, torta caprese da Buonocore da portare con voi per Marina Piccola.\n🍰 Torta caprese e gelato alla Pasticceria Buonocore (Via Vittorio Emanuele 35, vicino alla Piazzetta), da gustare a Marina Piccola dopo pranzo.\nA Capri centro, se resta tempo: Certosa di San Giacomo Via Camerelle Belvedere di Tragara Arco Naturale", "S": "risalita verso Marina Grande per le 14:00 — Giro dell'Isola in barca (~2 ore) + sosta alla Grotta Azzurra, poi traghetto di rientro a Ischia.\n🍽️ Cena a Ischia al rientro.\nPer una cena tipica con coniglio all'ischitana: Il Focolare (Barano d'Ischia, via Cretaio — familiare, immerso nel verde) o La Vigna di Alberto (Barano d'Ischia, via Giuseppe Garibaldi 57 — atmosfera intima, prodotti a km 0), entrambi comodi da casa."}, {"id": "d11", "title": "Ischia (Mar 8 settembre)", "links": [{"label": "Forio", "url": "https://maps.apple.com/?ll=40.7386,13.8583&q=Forio"}, {"label": "Spiaggia di San Francesco", "url": "https://maps.apple.com/?ll=40.7350,13.8480&q=Spiaggia%20di%20San%20Francesco"}, {"label": "Sorgeto", "url": "https://maps.apple.com/?ll=40.7030,13.8670&q=Panza%20/%20Sorgeto"}, {"label": "Panza", "url": "https://maps.apple.com/?ll=40.7030,13.8670&q=Panza%20/%20Sorgeto"}], "M": "piccola visita alla Chiesa del Soccorso e al lungomare di Forio, poi mare alla Spiaggia di San Francesco (pochi minuti a piedi dal centro, facile in auto).\n🥐 Colazione da Divino Cafè (Forio) — ottimi cornetti, babà e cannoli.", "P": "ancora mare a San Francesco, oppure Giardini Ravino (Citara) — giardino di piante grasse e cactus, con pavoni liberi e installazioni d'arte, molto diverso da La Mortella; aperto tutti i giorni tranne martedì e giovedì, 10€ a persona.", "S": "Baia di Sorgeto — pozze termali naturali sugli scogli, zona libera e gratuita, suggestiva al tramonto (zona Panza, pochi minuti da Citara)."}, {"id": "d12", "title": "Ischia (Mer 9 settembre)", "links": [{"label": "Spiaggia di Cartaromana", "url": "https://maps.apple.com/?ll=40.7395,13.9560&q=Cartaromana"}, {"label": "Ischia Ponte", "url": "https://maps.apple.com/?ll=40.7360,13.9581&q=Ischia%20Ponte"}, {"label": "Castello Aragonese", "url": "https://maps.apple.com/?ll=40.7333,13.9575&q=Castello%20Aragonese"}], "M": "ultimo mare con calma alla Spiaggia di Cartaromana (Ischia Ponte) — piccola baia di sabbia e ciottoli con sorgenti termali naturali, vista sul Castello Aragonese.\n🥐 Colazione da Bar Ciccio a Ischia Ponte (Piazza Antica Reggia) — ottimi brioches.", "P": "visita completa al Castello Aragonese di Ischia Ponte (1h30-2h con calma) — Terrazzo dell'Immacolata, Chiesa dell'Immacolata, il cimitero delle Monache Clarisse, gallerie scavate nella roccia.\n🍨 Gelato artigianale nel borgo di pescatori, dopo la visita (gusti locali: limone di Ischia, fico bianco).", "S": "relax serale nel borgo di pescatori di Ischia Ponte.\n🍸 Un ultimo drink come saluto a Ischia."}, {"id": "d13", "title": "Ischia → Pozzuoli → Ravello (Gio 10 settembre)", "links": [{"label": "Pozzuoli", "url": "https://maps.apple.com/?ll=40.8236,14.1219&q=Baia%20/%20Pozzuoli"}, {"label": "Ravello", "url": "https://maps.apple.com/?ll=40.6492,14.6114&q=Ravello"}, {"label": "Scala", "url": "https://maps.apple.com/?ll=40.6447,14.5964&q=Scala"}, {"label": "Villa Rufolo", "url": "https://maps.apple.com/?ll=40.6493,14.6117&q=Villa%20Rufolo"}, {"label": "Villa Cimbrone", "url": "https://maps.apple.com/?ll=40.6400,14.6066&q=Villa%20Cimbrone"}], "M": "traghetto Ischia → Pozzuoli delle 11:30, arrivo alle 12:30.", "P": "guida verso la Costiera Amalfitana (uscita autostradale consigliata a Salerno), arrivo a Scala (dove alloggiate, pochi minuti da Ravello), check-in, poi Villa Rufolo e Villa Cimbrone (Terrazza dell'Infinito) nel tardo pomeriggio — la luce di quell'ora è ideale per il panorama.\n🥪 Pranzo semplice (panino) durante il viaggio.", "S": "spesa per la casa, giro del paese di Scala e passeggiata nel centro storico."}, {"id": "d14", "title": "Ravello (Ven 11 settembre)", "links": [{"label": "Ravello", "url": "https://maps.apple.com/?ll=40.6492,14.6114&q=Ravello"}, {"label": "Amalfi", "url": "https://maps.apple.com/?ll=40.6340,14.6027&q=Amalfi"}, {"label": "Atrani", "url": "https://maps.apple.com/?ll=40.6323,14.6108&q=Atrani"}, {"label": "Duomo di Amalfi", "url": "https://maps.apple.com/?ll=40.634,14.6027&q=Duomo%20di%20Amalfi"}], "M": "ad Amalfi: Duomo di Amalfi (Cattedrale di Sant'Andrea) e Chiostro del Paradiso, poi Atrani — il borgo più piccolo della costiera, a 5 minuti a piedi da Amalfi, quasi nessun turista ci arriva.\n🥐 Colazione (pasticciotto) alla Pasticceria Andrea Pansa in Piazza Duomo — storica dal 1830. Se lo trovate, anche un sorbetto da A'Sciulia.", "P": "boat tour della Costiera delle 14:30 da Amalfi (rientro dopo circa 2 ore) — grotte, spiagge raggiungibili solo dal mare, bagno.", "S": "rientro a Ravello, passeggiata nel centro storico.\n🍷 Drink in piazza nel centro storico."}, {"id": "d15", "title": "Ravello (Sab 12 settembre)", "links": [{"label": "Ravello", "url": "https://maps.apple.com/?ll=40.6492,14.6114&q=Ravello"}, {"label": "Sentiero degli Dei", "url": "https://maps.apple.com/?ll=40.6250,14.5000&q=Sentiero%20degli%20Dei"}, {"label": "Nocelle", "url": "https://maps.apple.com/?ll=40.6193,14.4703&q=Nocelle"}, {"label": "Positano", "url": "https://maps.apple.com/?ll=40.6280,14.4848&q=Positano"}, {"label": "Amalfi", "url": "https://maps.apple.com/?ll=40.6340,14.6027&q=Amalfi"}], "M": "Sentiero degli Dei (Bomerano–Nocelle, ~5 km, circa 3 ore), partenza presto la mattina — sosta a Nocelle, il piccolo borgo alla fine del sentiero, prima della discesa verso Positano.\n🥪 Pranzo semplice (panino) durante il cammino.", "P": "arrivo a Positano, esplorazione del paese.", "S": "traghetto di ritorno verso Amalfi, poi rientro a Ravello."}, {"id": "d16", "title": "Ravello (Dom 13 settembre)", "links": [{"label": "Ravello", "url": "https://maps.apple.com/?ll=40.6492,14.6114&q=Ravello"}, {"label": "Minori", "url": "https://maps.apple.com/?ll=40.6499,14.6338&q=Minori"}, {"label": "Maiori", "url": "https://maps.apple.com/?ll=40.6519,14.6383&q=Maiori"}, {"label": "Vietri sul Mare", "url": "https://maps.apple.com/?ll=40.6669,14.7369&q=Vietri%20sul%20Mare"}, {"label": "Cetara", "url": "https://maps.apple.com/?ll=40.6547,14.7003&q=Cetara"}], "M": "noleggio scooter, giro della costiera verso Minori, con calma.\n🍰 Colazione alla Pasticceria Sal De Riso a Minori — una delle pasticcerie più famose d'Italia. Da provare la sfogliatella Santa Rosa, la sua reinterpretazione del dolce originario di Conca dei Marini.", "P": "proseguimento in scooter verso Maiori, poi Vietri sul Mare (le ceramiche) e Cetara — villaggio di pescatori famoso per la colatura di alici e il tonno, con soste libere lungo la costa.", "S": "rientro a Ravello, passeggiata nel centro storico.\n🐟 Cena a Ravello — Da Salvatore (gourmet, vista panoramica, ~60-70€ a persona, chiuso il lunedì), Bella Vista Sul Mare (tra Ravello e Scala, comodo da casa, terrazza con vista mozzafiato, pesce, ~40-50€ a persona, ottime recensioni), oppure Cumpà Cosimo (trattoria storica dal 1929, cucina casereccia, ~20-30€ a persona).\n🍷 Drink serale con vista nel centro di Ravello."}, {"id": "d17", "title": "Ravello → Maremma (Lun 14 settembre)", "links": [{"label": "Ravello", "url": "https://maps.apple.com/?ll=40.6492,14.6114&q=Ravello"}, {"label": "Vesuvio", "url": "https://maps.apple.com/?ll=40.8219,14.4262&q=Vesuvio"}, {"label": "Follonica", "url": "https://maps.apple.com/?ll=42.9186,10.7561&q=Follonica%20/%20Castiglione%20della%20Pescaia"}, {"label": "Castiglio let me = localStorage.getItem('vacanza2026_who') || null;
let diaryState = {};
let expenseState = {};
let packState = {};

function initLocalDefaults() {
  SEED.days.forEach(d => {
    diaryState[d.id] = { M: d.M, P: d.P, S: d.S, by: '', ts: 0 };
  });
  SEED.expenses.forEach(e => {
    expenseState[e.id] = { actual: null, label: e.label, category: e.category, estMin: e.estMin, estMax: e.estMax };
  });
  SEED.packing.forEach(p => { packState[p.id] = { done: false }; });
}
initLocalDefaults();

function syncStatusMsg(msg, isErr) {
  const el = document.getElementById('syncStatus');
  if (el) { el.textContent = msg; el.className = 'sync-status' + (isErr ? ' err' : ''); }
}

function attachSync() {
  if (!firebaseReady) {
    syncStatusMsg('Firebase non configurato: le modifiche restano solo su questo telefono. Vedi le istruzioni per collegare il database condiviso.', true);
    return;
  }
  db.ref('diary').on('value', snap => {
    const val = snap.val() || {};
    SEED.days.forEach(d => { if (val[d.id]) diaryState[d.id] = val[d.id]; });
    renderDiary();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  db.ref('expenses').on('value', snap => {
    const val = snap.val() || {};
    SEED.expenses.forEach(e => {
      if (val[e.id] && val[e.id].actual !== undefined) expenseState[e.id].actual = val[e.id].actual;
    });
    Object.keys(val).forEach(id => {
      if (!SEED.expenses.find(e => e.id === id)) {
        expenseState[id] = val[id];
        SEED.expenses.push({ id, category: val[id].category, label: val[id].label, estMin: val[id].estMin, estMax: val[id].estMax });
      }
    });
    renderExpenses();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  db.ref('packing').on('value', snap => {
    const val = snap.val() || {};
    SEED.packing.forEach(p => { if (val[p.id] && val[p.id].done !== undefined) packState[p.id] = val[p.id]; });
    // remote-added custom items
    Object.keys(val).forEach(id => {
      if (!SEED.packing.find(p => p.id === id) && val[id].label) {
        SEED.packing.push({ id, category: val[id].category, label: val[id].label });
        packState[id] = val[id];
      }
    });
    // remote-deleted custom items (only custom ones, never touch the baseline list)
    SEED.packing = SEED.packing.filter(p => !p.id.startsWith('pcustom_') || val[p.id]);
    renderPacking();
  }, err => syncStatusMsg('Errore di sincronizzazione: ' + err.message, true));

  syncStatusMsg('Connesso — le modifiche si vedono su entrambi i telefoni.', false);
}

function debounce(fn, wait) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
}

const saveDiaryField = debounce((dayId, field, value) => {
  diaryState[dayId][field] = value;
  diaryState[dayId].by = me || '?';
  diaryState[dayId].ts = Date.now();
  if (firebaseReady) db.ref('diary/' + dayId).set(diaryState[dayId]);
  renderDiaryMeta(dayId);
}, 500);

function saveExpenseActual(id, actual) {
  expenseState[id].actual = actual;
  if (firebaseReady) db.ref('expenses/' + id).set(expenseState[id]);
  renderExpTotals();
}

function saveExpenseNew(item) {
  expenseState[item.id] = item;
  if (firebaseReady) db.ref('expenses/' + item.id).set(item);
}

function deleteExpense(id) {
  delete expenseState[id];
  const idx = SEED.expenses.findIndex(e => e.id === id);
  if (idx > -1) SEED.expenses.splice(idx, 1);
  if (firebaseReady) db.ref('expenses/' + id).remove();
  renderExpenses();
}

function togglePack(id) {
  packState[id].done = !packState[id].done;
  const p = SEED.packing.find(x => x.id === id);
  const payload = { done: packState[id].done };
  if (p && id.startsWith('pcustom_')) { payload.label = p.label; payload.category = p.category; }
  if (firebaseReady) db.ref('packing/' + id).set(payload);
  renderPackingItem(id);
}

    } else {
      html += `<div class="cal-cell">${cell.day}</div>`;
    }
  });
  html += '</div>';
  c.innerHTML = html;
}

let calendarOpen = true;

function toggleCalendar() {
  calendarOpen = !calendarOpen;
  document.getElementById('calendarGrid').style.display = calendarOpen ? 'block' : 'none';
  if (calendarOpen) {
    document.querySelectorAll('.day-card').forEach(el => { el.style.display = 'none'; });
    document.querySelectorAll('.cal-active').forEach(el => el.classList.remove('current'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function selectDayFromCalendar(dayId) {
  goToDay(dayId);
  calendarOpen = false;
  document.getElementById('calendarGrid').style.display = 'none';
}

function goToDay(dayId) {
  document.querySelectorAll('.cal-active').forEach(el => el.classList.remove('current'));
  const cellEls = document.querySelectorAll('.cal-active');
  CAL_CELLS.filter(c => c.dayId).forEach((c, i) => {
    if (c.dayId === dayId) cellEls[i].classList.add('current');
  });
  document.querySelectorAll('.day-card').forEach(el => {
    el.style.display = (el.id === 'daycard-' + dayId) ? 'block' : 'none';
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function stepDay(delta) {
  const visible = document.querySelector('.day-card[style*="display: block"]');
  if (!visible) return;
  const currentId = visible.id.replace('daycard-', '');
  const idx = SEED.days.findIndex(d => d.id === currentId);
  const nextIdx = idx + delta;
  if (nextIdx < 0 || nextIdx >= SEED.days.length) return;
  goToDay(SEED.days[nextIdx].id);
}

const editingRows = new Set();

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function linkify(text, links, used) {
  used = used || new Set();
  let escaped = escapeHtml(text);
  const placeholders = {};
  let counter = 0;
  const sorted = [...links].sort((a, b) => b.label.length - a.label.length);
  sorted.forEach(l => {
    if (used.has(l.label)) return;
    const re = new RegExp('(?<![A-Za-zÀ-ÿ\'])' + escapeRegex(l.label) + '(?![A-Za-zÀ-ÿ])', 'g');
    let matchedOnce = false;
    escaped = escaped.replace(re, (match) => {
      if (matchedOnce) return match;
      matchedOnce = true;
      used.add(l.label);
      const key = '@@LINK' + (counter++) + '@@';
      placeholders[key] = `<a class="place-link" href="${l.url}" target="_blank" rel="noopener">${match}</a>`;
      return key;
    });
  });
  Object.keys(placeholders).forEach(k => { escaped = escaped.split(k).join(placeholders[k]); });
  return escaped;
}

function getDayUsedSetUpTo(dayId, stopField) {
  // Walks the day's content in reading order (M, P, S)
  // and marks place labels as "used" up to (but not including) the given field.
  const d = SEED.days.find(x => x.id === dayId);
  const used = new Set();
  const order = ['M', 'P', 'S'];
  for (const f of order) {
    if (stopField === f) return used;
    linkify(diaryState[dayId][f] || '', d.links, used);
  }
  return used;
}

const ROW_META = {
  M: { icon: '🌅', word: 'Mattina' },
  P: { icon: '☀️', word: 'Pomeriggio' },
  S: { icon: '🌙', word: 'Sera' }
};

function diaryRowHtml(d, field) {
  const rm = ROW_META[field];
  return `<div class="dayrow">
    <div class="rlabel" title="${rm.word}">${field}</div>
    <div class="rowcontent" id="rowcontent-${d.id}-${field}">${rowContentHtml(d, field)}</div>
  </div>`;
}

function rowContentHtml(d, field) {
  const key = d.id + '-' + field;
  const text = diaryState[d.id][field] || '';
  if (editingRows.has(key)) {
    return `<textarea autofocus onblur="finishEdit('${d.id}','${field}',this.value)">${escapeHtml(text)}</textarea>`;
  }
  if (!text) {
    return `<div class="rdisplay" onclick="startEdit('${d.id}','${field}')"><span class="rempty">tocca per scrivere…</span></div>`;
  }
  const used = getDayUsedSetUpTo(d.id, field);
  const lines = text.split('\n').filter(l => l.length > 0);
  const linesHtml = lines.map((line, i) => {
    const linked = linkify(line, d.links, used);
    return i === 0 ? `<div class="rline-main">${linked}</div>` : `<div class="rline-note">${linked}</div>`;
  }).join('');
  return `<div class="rdisplay" onclick="startEdit('${d.id}','${field}')">${linesHtml}</div>`;
}

function startEdit(dayId, field) {
  editingRows.add(dayId + '-' + field);
  const el = document.getElementById('rowcontent-' + dayId + '-' + field);
  const d = SEED.days.find(x => x.id === dayId);
  el.innerHTML = rowContentHtml(d, field);
  const ta = el.querySelector('textarea');
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

function finishEdit(dayId, field, value) {
  editingRows.delete(dayId + '-' + field);
  saveDiaryFieldNow(dayId, field, value);
  const el = document.getElementById('rowcontent-' + dayId + '-' + field);
  const d = SEED.days.find(x => x.id === dayId);
  if (el) el.innerHTML = rowContentHtml(d, field);
}

function saveDiaryFieldNow(dayId, field, value) {
  diaryState[dayId][field] = value;
  diaryState[dayId].by = me || '?';
  diaryState[dayId].ts = Date.now();
  if (firebaseReady) db.ref('diary/' + dayId).set(diaryState[dayId]);
  renderDiaryMeta(dayId);
}

function renderDiary() {
  const c = document.getElementById('daysContainer');
  if (c.dataset.built === '1') {
    SEED.days.forEach(d => {
      ['M','P','S'].forEach(f => {
        const key = d.id + '-' + f;
        if (editingRows.has(key)) return;
        const el = document.getElementById('rowcontent-' + d.id + '-' + f);
        if (el) el.innerHTML = rowContentHtml(d, f);
      });
      renderDiaryMeta(d.id);
    });
    return;
  }
  c.dataset.built = '1';
  c.innerHTML = SEED.days.map((d, i) => `
    <div class="day-card" id="daycard-${d.id}" style="display: none;">
      <div class="day-head-static">
        <button class="day-nav-btn" onclick="stepDay(-1)" ${i === 0 ? 'disabled' : ''}>‹</button>
        <div class="day-head-mid" onclick="toggleCalendar()">
          <div class="dnum">GIORNO ${i + 1} DI ${SEED.days.length} · 📅</div>
          <div class="dtitle">${d.title}</div>
        </div>
        <button class="day-nav-btn" onclick="stepDay(1)" ${i === SEED.days.length - 1 ? 'disabled' : ''}>›</button>
      </div>
      <div class="day-body">
        ${diaryRowHtml(d, 'M')}
        ${diaryRowHtml(d, 'P')}
        ${diaryRowHtml(d, 'S')}
        <div class="diary-meta" id="diary-meta-${d.id}"></div>
      </div>
    </div>
  `).join('');
  SEED.days.forEach(d => renderDiaryMeta(d.id));
}

function renderDiaryMeta(dayId) {
  const el = document.getElementById('diary-meta-' + dayId);
  if (!el) return;
  const s = diaryState[dayId];
  el.textContent = s.by && s.ts ? `Ultima modifica di ${s.by === 'A' ? PERSON_A : s.by === 'B' ? PERSON_B : s.by} — ${new Date(s.ts).toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}` : '';
}

function escapeHtml(s) {
  return (s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/* ---------------------- Spese ---------------------- */
function renderExpenses() {
  const cats = [...new Set(SEED.expenses.map(e => e.category))];
  const c = document.getElementById('expCategories');
  c.innerHTML = cats.map(cat => {
    const items = SEED.expenses.filter(e => e.category === cat);
    return `
      <div class="exp-cat">
        <h3>${cat}</h3>
        ${items.map(e => expItemHtml(e)).join('')}
        <div class="add-row">
          <input type="text" placeholder="Nuova voce…" id="newlabel-${safeId(cat)}">
          <input type="number" placeholder="€" class="short" id="newamt-${safeId(cat)}">
          <button onclick="addExpense('${escapeAttr(cat)}')">+ Aggiungi</button>
        </div>
      </div>
    `;
  }).join('');
  renderExpTotals();
}

function safeId(s) { return s.replace(/[^a-zA-Z0-9]/g, ''); }
function escapeAttr(s) { return s.replace(/'/g, "\\'"); }

function expItemHtml(e) {
  const st = expenseState[e.id] || { actual: null };
  const placeholder = (e.estMin === e.estMax || e.estMax == null) ? `stima ${fmtEuroPlain(e.estMin)}` : `stima ${fmtEuroPlain(e.estMin)}–${fmtEuroPlain(e.estMax)}`;
  return `
    <div class="exp-item ${st.actual != null ? 'is-actual' : ''}">
      <div class="exp-label">${e.label}</div>
      <input type="number" placeholder="${placeholder}" value="${st.actual != null ? st.actual : ''}"
        onchange="saveExpenseActual('${e.id}', this.value === '' ? null : parseFloat(this.value))">
      <button class="del-btn" title="Elimina voce" onclick="deleteExpense('${e.id}')">✕</button>
    </div>
  `;
}

function fmtEuroPlain(n) { return n == null ? '—' : (Number.isInteger(n) ? n : n.toFixed(2)); }
function fmtEuro(n) { return n == null ? '—' : fmtEuroPlain(n) + '€'; }

function addExpense(cat) {
  const labelEl = document.getElementById('newlabel-' + safeId(cat));
  const amtEl = document.getElementById('newamt-' + safeId(cat));
  const label = labelEl.value.trim();
  const amt = parseFloat(amtEl.value);
  if (!label) return;
  const id = 'custom_' + Date.now();
  const item = { id, category: cat, label, estMin: isNaN(amt) ? 0 : amt, estMax: isNaN(amt) ? 0 : amt, actual: isNaN(amt) ? null : amt };
  SEED.expenses.push(item);
  saveExpenseNew(item);
  renderExpenses();
}

function renderExpTotals() {
  let estTotalMin = 0, estTotalMax = 0, actualTotal = 0, actualCount = 0;
  SEED.expenses.forEach(e => {
    const st = expenseState[e.id] || {};
    if (st.actual != null && !isNaN(st.actual)) {
      actualTotal += st.actual;
      actualCount++;
    } else {
      estTotalMin += (e.estMin || 0);
      estTotalMax += (e.estMax != null ? e.estMax : e.estMin || 0);
    }
  });
  const grandMin = estTotalMin + actualTotal;
  const grandMax = estTotalMax + actualTotal;
  document.getElementById('expEstTotal').textContent = grandMin === grandMax ? fmtEuro(grandMin) : `${fmtEuro(grandMin)}–${fmtEuro(grandMax)}`;
  document.getElementById('expActualTotal').textContent = fmtEuro(actualTotal) + (actualCount ? ` (${actualCount} voci confermate)` : '');
  document.getElementById('expRemaining').textContent = estTotalMin === estTotalMax ? fmtEuro(estTotalMin) : `${fmtEuro(estTotalMin)}–${fmtEuro(estTotalMax)}`;
}

/* ---------------------- Da portare ---------------------- */
function renderPacking() {
  const cats = [...new Set(SEED.packing.map(p => p.category))];
  const c = document.getElementById('packCategories');
  c.innerHTML = cats.map(cat => {
    const items = SEED.packing.filter(p => p.category === cat);
    return `<div class="pack-cat"><h3>${cat}</h3>${items.map(p => packItemHtml(p)).join('')}
      <div class="add-row">
        <input type="text" placeholder="Nuovo oggetto…" id="newpack-${safeId(cat)}"
          onkeydown="if(event.key==='Enter'){addPackItem('${escapeAttr(cat)}');}">
        <button onclick="addPackItem('${escapeAttr(cat)}')">+</button>
      </div>
    </div>`;
  }).join('');
}

function packItemHtml(p) {
  const st = packState[p.id] || { done: false };
  return `
    <div class="pack-item" id="packrow-${p.id}">
      <label class="pack-item-label">
        <input type="checkbox" class="p-checkbox" ${st.done ? 'checked' : ''} onchange="togglePack('${p.id}')">
        <span class="p-label ${st.done ? 'is-done' : ''}">${p.label}</span>
      </label>
      <button class="del-btn" title="Rimuovi" onclick="deletePackItem('${p.id}')">✕</button>
    </div>
  `;
}

function addPackItem(cat) {
  const input = document.getElementById('newpack-' + safeId(cat));
  const label = input.value.trim();
  if (!label) return;
  const id = 'pcustom_' + Date.now();
  const item = { id, category: cat, label };
  SEED.packing.push(item);
  packState[id] = { done: false };
  if (firebaseReady) db.ref('packing/' + id).set(packState[id]);
  renderPacking();
}

function deletePackItem(id) {
  const idx = SEED.packing.findIndex(p => p.id === id);
  if (idx > -1) SEED.packing.splice(idx, 1);
  delete packState[id];
  if (firebaseReady) db.ref('packing/' + id).remove();
  renderPacking();
}

function renderPackingItem(id) {
  const el = document.getElementById('packrow-' + id);
  if (!el) return;
  const p = SEED.packing.find(x => x.id === id);
  if (!p) return;
  el.outerHTML = packItemHtml(p);
}

/* ---------------------- Da assaggiare ---------------------- */
function renderFood() {
  const cats = [...new Set(SEED.food.map(f => f.category))];
  const c = document.getElementById('foodCategories');
  c.innerHTML = cats.map(cat => {
    const items = SEED.food.filter(f => f.category === cat);
    return `<div class="food-cat"><h3>${cat}</h3><ul>${items.map(f => `<li>${f.label}</li>`).join('')}</ul></div>`;
  }).join('');
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

function setWho(p) {
  me = p;
  localStorage.setItem('vacanza2026_who', p);
  whoBtn.textContent = p === 'A' ? PERSON_A : PERSON_B;
  whoModal.classList.remove('show');

if (me) { whoBtn.textContent = me === 'A' ? PERSON_A : PERSON_B; }
else { whoModal.classList.add('show'); }

renderCalendar();
renderDiary();
renderExpenses();
renderPacking();
renderFood();
attachSync();
</script>
